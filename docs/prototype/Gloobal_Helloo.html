<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gloobal Helloo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column. Login → app (tabs: Chats, Calls, [Pad], Contacts, Me) → thread → call.
   Deliberately single light theme to match the Gloobal ID app; call screen is its own dark world. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --wash:#F7F4FF; --card:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1ECFF; --line:#E9E3FB;
  --fg:#15122B; --muted:#6E6888;
  --purple:#6C3BEA; --purple-2:#8B5CF6; --purple-soft:#EEE7FF; --purple-ink:#FFFFFF; --acc-rgb:108,59,234;
  --tint-a:rgba(214,250,233,.6); --tint-b:rgba(255,226,238,.7);
  --g-green:#06A06B; --g-pink:#E1297C; --red:#DF2A2A; --orange:#E8641B;
  --ok:#0E9F62; --bad:#DF2A2A;
  --call-bg:#120B2E; --call-fg:#F4F1FF; --call-hi:#8B5CF6;
  --shadow-soft:0 8px 22px rgba(var(--acc-rgb),.14);
  --f-logo:"Outfit", "Plus Jakarta Sans", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
/* System-dark viewers start in Midnight until they pick a theme */
@media (prefers-color-scheme: dark){:root:not([data-gtheme]){
  --bg:#0E0B1F; --wash:#151129; --card:#1B1636; --surface:#151129; --surface-2:#241D45; --line:#2E2652;
  --fg:#F1EEFF; --muted:#9C95BE; --purple:#8C69FF; --purple-2:#B79CFF; --purple-soft:#2A2152; --acc-rgb:140,105,255;
  --tint-a:rgba(6,160,107,.12); --tint-b:rgba(225,41,124,.14); --call-bg:#07051A; --call-hi:#8C69FF; color-scheme:dark }}
:root[data-gtheme="emerald"]{ --wash:#F1FAF6; --surface-2:#E2F5EB; --line:#D4ECE0; --fg:#0F2219; --muted:#587266;
  --purple:#058B5D; --purple-2:#10B981; --purple-soft:#DCF5EA; --acc-rgb:5,139,93; --call-bg:#05241A; --call-hi:#10B981;
  --tint-a:rgba(16,185,129,.16); --tint-b:rgba(250,204,21,.16) }
:root[data-gtheme="rose"]{ --wash:#FFF4F8; --surface-2:#FDE7F0; --line:#F6D8E5; --fg:#2A0F1C; --muted:#82657A;
  --purple:#D41F6D; --purple-2:#EC4899; --purple-soft:#FCE3EE; --acc-rgb:212,31,109; --call-bg:#2A0718; --call-hi:#EC4899;
  --tint-a:rgba(251,146,60,.14); --tint-b:rgba(236,72,153,.16) }
:root[data-gtheme="ocean"]{ --wash:#F2F6FF; --surface-2:#E5EDFF; --line:#D8E3FA; --fg:#0E1A33; --muted:#5D6B86;
  --purple:#1D5FE0; --purple-2:#3B82F6; --purple-soft:#E0EAFF; --acc-rgb:29,95,224; --call-bg:#06132F; --call-hi:#3B82F6;
  --tint-a:rgba(56,189,248,.16); --tint-b:rgba(129,140,248,.16) }
:root[data-gtheme="midnight"]{ --bg:#0E0B1F; --wash:#151129; --card:#1B1636; --surface:#151129; --surface-2:#241D45; --line:#2E2652;
  --fg:#F1EEFF; --muted:#9C95BE; --purple:#8C69FF; --purple-2:#B79CFF; --purple-soft:#2A2152; --acc-rgb:140,105,255;
  --tint-a:rgba(6,160,107,.12); --tint-b:rgba(225,41,124,.14); --call-bg:#07051A; --call-hi:#8C69FF; color-scheme:dark }
:root[data-gtheme="aurora"]{ --bg:#06151A; --wash:#0B1F25; --card:#10282F; --surface:#0B1F25; --surface-2:#15343B; --line:#1D4048;
  --fg:#E6FBF7; --muted:#8AB2AC; --purple:#0FA493; --purple-2:#5EEAD4; --purple-soft:#11393A; --acc-rgb:15,164,147;
  --tint-a:rgba(94,234,212,.10); --tint-b:rgba(167,139,250,.12); --call-bg:#020E11; --call-hi:#2DD4BF; color-scheme:dark }
html,body{height:100%}
body{background:var(--wash);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
#root{height:100%;display:flex;justify-content:center}
.app{transition:background .3s;position:relative;width:100%;min-width:0;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.fwd{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
.back{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
.fade{animation:fadeUp .3s ease-out}
@keyframes inR{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-22%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}

/* logo */
.logo{font-family:var(--f-logo);font-weight:900;letter-spacing:.01em;display:inline-flex;align-items:center;line-height:1;color:var(--fg)}
.logo i{display:inline-block;width:.78em;height:.78em;border-radius:50%;margin-inline:.03em}
.logo i.g{background:var(--g-green)} .logo i.p{background:var(--g-pink)}
.logo small{font-weight:800;margin-left:.3em}

/* header */
.top{padding-block:14px 8px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-family:var(--f-logo);font-weight:800;font-size:26px;letter-spacing:-.01em;flex:1}
.roundbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-soft);color:var(--purple);flex:none}
.roundbtn.plain{color:var(--fg)}

/* lists */
.search{display:flex;align-items:center;gap:8px;background:var(--wash);border:1px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--muted)}
.search input{flex:1;border:0;background:none;color:var(--fg);font:inherit;outline:none;min-width:0}
.chips{display:flex;gap:6px;padding-block:10px;overflow-x:auto}
.chip{padding:7px 13px;border-radius:99px;background:var(--wash);font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--purple);color:var(--purple-ink)}
.row{display:flex;align-items:center;gap:12px;padding-block:10px;width:100%}
.rowmain{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-logo);font-weight:800;font-size:17px;color:#fff;position:relative}
.av .flag{position:absolute;right:-3px;bottom:-3px;font-size:13px;background:var(--bg);border-radius:99px;width:20px;height:20px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.av .online{position:absolute;left:1px;bottom:1px;width:12px;height:12px;border-radius:9px;background:var(--ok);border:2px solid var(--bg)}
.av.lg{width:104px;height:104px;font-size:38px}
.av.md{width:72px;height:72px;font-size:26px}
.rmain{flex:1;min-width:0}
.rname{font-weight:700;display:flex;gap:6px;align-items:baseline}
.rname span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtime{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.rtime.hot{color:var(--purple)}
.rsub{color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center;margin-top:1px}
.rsub span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub.miss{color:var(--bad)}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:var(--purple);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn.soft{background:var(--purple-soft);color:var(--purple)}
.sect{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-block:16px 4px}
.foot{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);padding-block:18px 28px}

/* bottom nav with raised pad button */
.nav{position:relative;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{padding-block:9px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tab.on{color:var(--purple)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 17px);width:9px;height:9px;border-radius:9px;background:var(--g-pink);border:2px solid var(--surface)}
.padbtn{justify-self:center;margin-bottom:10px;width:62px;height:62px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(var(--acc-rgb),.42);transform:translateY(-12px);transition:transform .2s}
.padbtn.on{background:linear-gradient(145deg,var(--purple-2),var(--purple))}
.padbtn:active{transform:translateY(-12px) scale(.94)}

/* ---------- symbol ID & circular pad ---------- */
.slots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(3px,1vw,5px);width:100%}
.slot{min-width:0;width:100%;height:clamp(30px,9vw,42px);align-self:start;border-radius:9px;border:2px solid var(--purple-2);background:var(--purple-soft);color:var(--fg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:clamp(12px,3.6vw,17px);transition:transform .15s, background .15s}
.slot.blank{background:var(--card);border-color:var(--line)}
.slot.cur{border-color:var(--purple);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18)}
.slot.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:none}}
.slot .hid{width:5px;height:5px;border-radius:5px;background:var(--fg)}
.progress{display:flex;justify-content:center;gap:clamp(6px,2.4vw,14px);padding-block:14px}
.progress i{width:12px;height:12px;border-radius:12px;background:var(--surface-2);transition:background .2s, transform .2s}
.progress i.on{background:var(--purple);transform:scale(1.05)}
.symrow{display:inline-flex;gap:3px;flex-wrap:wrap}
.symrow b{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--wash);border:1px solid var(--line)}

.dial{position:relative;width:var(--size);height:var(--size);margin-inline:auto;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--card) 0%,var(--wash) 60%,var(--surface-2) 100%);box-shadow:0 0 0 3px var(--line), 0 16px 40px rgba(var(--acc-rgb),.12)}
.dial.spin{animation:spin .45s cubic-bezier(.3,.7,.3,1)}
@keyframes spin{from{transform:rotate(-45deg)}to{transform:none}}
.sym{position:absolute;width:21%;height:21%;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:calc(var(--size)*.075);background:radial-gradient(circle at 50% 35%,var(--card),var(--wash));box-shadow:0 6px 14px rgba(var(--acc-rgb),.16), 0 0 0 1px var(--line);transition:transform .1s, box-shadow .1s}
.sym:active,.sym.hit{transform:translate(-50%,-50%) scale(.9);box-shadow:0 2px 6px rgba(var(--acc-rgb),.22), 0 0 0 2px var(--purple-2)}
.center{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 45% 35%,#F04545,#C81E1E);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(223,42,42,.38)}
.center:active{transform:translate(-50%,-50%) scale(.92)}

.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;background:var(--purple-soft);font-weight:800;font-size:17px;min-height:46px}
.pill.ok{color:var(--g-green)} .pill.new{color:var(--purple)} .pill.idle{color:var(--muted);font-size:14px;font-weight:700}
.inbtn{width:84px;height:84px;border-radius:50%;background:var(--purple);color:#fff;font-family:var(--f-logo);font-weight:800;font-size:24px;display:grid;place-items:center;box-shadow:0 12px 30px rgba(var(--acc-rgb),.42);transition:opacity .2s, transform .15s}
.inbtn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.inbtn:not(:disabled):active{transform:scale(.94)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* login */
.login{background:radial-gradient(120% 60% at 50% 0%, var(--bg) 40%, var(--wash) 100%)}
.idcard{position:relative;margin-top:8px;padding:30px 14px 22px;border-radius:30px;background:linear-gradient(135deg,var(--tint-a),var(--card) 30%,var(--card) 70%,var(--tint-b));box-shadow:0 10px 30px rgba(var(--acc-rgb),.1),0 0 0 1px var(--line)}
.idcard .tag{position:absolute;top:-16px;left:18px;padding:7px 14px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--purple)}
.idcard .eye{position:absolute;top:-16px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--muted)}
.sidebtns{position:absolute;right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;z-index:2}
.flags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flags span{position:absolute;font-size:22px;opacity:.85;animation:drift var(--dur) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) rotate(-6deg)}to{transform:translate(var(--dx),var(--dy)) rotate(8deg)}}

/* thread */
.thead{display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.thead .who{flex:1;min-width:0;text-align:left}
.thead .who b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead .who small{font-size:12px;color:var(--ok);font-weight:600}
.feed{display:flex;flex-direction:column;gap:5px;padding-block:14px;background:transparent}
.threadbg{background:linear-gradient(180deg,var(--wash),var(--bg) 60%)}
.daysep{align-self:center;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line);margin-block:6px}
.b{max-width:78%;padding:9px 13px;border-radius:20px;font-size:15px;overflow-wrap:anywhere;animation:bubble .22s ease-out}
@keyframes bubble{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.b.me{align-self:flex-end;background:var(--purple);color:#fff;border-bottom-right-radius:6px}
.b.them{align-self:flex-start;background:var(--card);box-shadow:0 0 0 1px var(--line);border-bottom-left-radius:6px}
.b .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;opacity:.78;margin-top:2px;font-variant-numeric:tabular-nums}
.tick.read{color:#9BF5CF;opacity:1}
.voice{display:flex;align-items:center;gap:10px;min-width:180px}
.voice .play{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.b.them .voice .play{background:var(--purple-soft);color:var(--purple)}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.55}
.wave i.done{opacity:1}
.callev{align-self:center;display:flex;align-items:center;gap:10px;padding:7px 7px 7px 14px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:13px;font-weight:700;margin-block:4px;animation:bubble .22s ease-out}
.callev.missed{color:var(--bad)}
.callev .again{white-space:nowrap;flex:none;padding:6px 11px;border-radius:11px;background:var(--purple-soft);color:var(--purple);font-size:12px;font-weight:800}
.typing{align-self:flex-start;display:flex;gap:4px;padding:13px 15px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.typing i{width:7px;height:7px;border-radius:9px;background:var(--purple-2);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.composer{display:flex;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line);background:var(--surface);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.composer input{flex:1;min-width:0;border:0;background:var(--wash);color:var(--fg);border-radius:22px;padding:12px 16px;font:inherit;outline:none}
.send{width:46px;height:46px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}
.send:active{transform:scale(.9)}
.send.rec{background:var(--red);animation:recpulse 1s infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 8px rgba(223,42,42,.18)}}
.recbar{flex:1;display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-family:var(--f-mono);padding-inline:6px}
.recbar i{width:9px;height:9px;border-radius:9px;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* dial tab */
.idbar{padding:14px;border-radius:22px;background:var(--wash)}
.matches{display:flex;gap:8px;overflow-x:auto;padding-block:10px;min-height:62px}
.match{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:700;font-size:13px;white-space:nowrap;animation:fadeUp .2s ease-out}
.match .av{width:32px;height:32px;font-size:12px}
.match.full{box-shadow:0 0 0 2px var(--g-green)}
.dialacts{display:flex;justify-content:center;align-items:center;gap:26px;padding-block:14px 18px}
.bigcall{width:68px;height:68px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(14,159,98,.35);transition:opacity .2s}
.bigcall:disabled{opacity:.35;box-shadow:none}

/* sheet */
.backdrop{position:absolute;inset:0;z-index:15;background:rgba(21,18,43,.38);animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:16;background:var(--card);border-radius:28px 28px 0 0;padding-block:10px 22px;padding-bottom:max(22px,env(safe-area-inset-bottom,0px));animation:sheetup .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
@keyframes sheetup{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line)}
.sheetacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.sheetacts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;background:var(--wash);font-weight:700;font-size:13px;color:var(--purple)}

/* call */
.call{position:absolute;inset:0;z-index:20;background:var(--call-bg);color:var(--call-fg);display:flex;flex-direction:column;animation:fadeUp .3s ease-out}
.glow{position:absolute;inset:0;pointer-events:none}
.ctop{position:relative;padding-block:18px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;gap:10px}
.secure{font-family:var(--f-mono);display:flex;align-items:center;gap:6px;opacity:.85}
.cmid{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.cmid h2{margin:0;font-family:var(--f-logo);font-size:32px;font-weight:800;text-wrap:balance}
.cstate{font-family:var(--f-mono);font-size:16px;opacity:.85;font-variant-numeric:tabular-nums}
.ring{position:relative}
.ring::before,.ring::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--call-hi);opacity:0;animation:pulse 1.8s infinite}
.ring::after{animation-delay:.9s}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.meter{display:flex;gap:8px;font-size:12px;flex-wrap:wrap;justify-content:center}
.meter span{padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.08)}
.meter b{font-family:var(--f-mono);color:#B9F5D8}
.ccontrols{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-block:10px 16px;max-width:380px;width:100%;margin-inline:auto}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;opacity:.92}
.cbtn span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:background .15s}
.cbtn.on span{background:var(--call-fg);color:var(--call-bg)}
.endrow{position:relative;display:flex;justify-content:center;padding-block:6px 26px;padding-bottom:max(26px,env(safe-area-inset-bottom,0px))}
.endbtn{width:72px;height:72px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(223,42,42,.45)}
.selfview{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:60px;width:96px;height:134px;border-radius:20px;background:linear-gradient(160deg,#3D2A8A,#1B1245);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:11px;font-weight:700;z-index:1}
.vidbg{position:absolute;inset:0;background:radial-gradient(110% 75% at 50% 28%, var(--call-hi) 0%, color-mix(in srgb, var(--call-hi) 35%, var(--call-bg)) 45%, var(--call-bg) 100%)}
.keypadsm{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:300px;margin-inline:auto;padding-block:6px}
.keypadsm button{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1);font-family:var(--f-mono);font-size:22px;font-weight:600}

/* floating */
.toast{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:700;z-index:40;white-space:nowrap;animation:fadeUp .2s ease-out;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.banner{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:10px;z-index:25;background:var(--call-bg);color:var(--call-fg);border-radius:24px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(18,11,46,.4);animation:fadeUp .25s ease-out;text-align:left}
.banner small{opacity:.75;font-size:12px}
.mini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.livepill{position:absolute;left:50%;transform:translateX(-50%);bottom:94px;z-index:24;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--ok);color:#fff;font-weight:800;font-size:13px;box-shadow:0 10px 24px rgba(14,159,98,.35);animation:fadeUp .25s ease-out}
.livepill .mini{width:32px;height:32px;background:rgba(0,0,0,.2)}

/* me */
.mecard{margin-block:8px;padding:20px;border-radius:28px;background:linear-gradient(135deg,var(--tint-a),var(--card) 35%,var(--card) 65%,var(--tint-b));box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(var(--acc-rgb),.08);display:flex;flex-direction:column;gap:16px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:0 0 0 1px var(--line)}
.stat b{display:block;font-family:var(--f-logo);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px;font-weight:700}
.listbtn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--wash);font-weight:700;text-align:left;width:100%}
.listbtn em{font-style:normal;margin-left:auto;color:var(--muted);font-size:12px;font-weight:600}
.listbtn .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--card);color:var(--purple);flex:none}
.stack{display:flex;flex-direction:column;gap:8px}
/* nav pill */
.ti{width:58px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .25s, transform .25s}
.tab.on .ti{background:var(--purple-soft);transform:scale(1.04)}
.tab.on .ti svg g[opacity]{opacity:.5}
.tab .dot{top:4px;right:calc(50% - 22px)}
.rowmain{transition:transform .15s}
.rowmain:active{transform:scale(.985)}
/* bubbles */
.bwrap{position:relative;display:flex;flex-direction:column;max-width:82%;touch-action:pan-y;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.bwrap.me{align-self:flex-end;align-items:flex-end}
.bwrap.them{align-self:flex-start;align-items:flex-start}
.bwrap .b{max-width:100%;cursor:pointer;user-select:none;-webkit-user-select:none;transition:filter .15s, transform .15s}
.bwrap .b:active{transform:scale(.98)}
.swipeic{position:absolute;left:-34px;top:50%;transform:translateY(-50%) scale(.6);opacity:0;color:var(--purple);transition:opacity .15s, transform .15s}
.bwrap[data-swipe="go"] .swipeic{opacity:1;transform:translateY(-50%) scale(1)}
.bwrap.me .swipeic{left:-34px}
.react{margin-top:-8px;padding:2px 7px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.08);font-size:14px;z-index:1;animation:pop .25s ease-out}
.bwrap.me .react{margin-right:10px}.bwrap.them .react{margin-left:10px}
.fwdtag{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;opacity:.75;font-style:italic;margin-bottom:2px}
.quote{display:block;margin:-2px -5px 6px;padding:6px 10px;border-radius:12px;border-left:3px solid var(--g-green);background:rgba(0,0,0,.08);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.b.them .quote,.replybar .quote{background:var(--wash);border-left-color:var(--purple)}
.quote b{display:block;font-size:12px;color:inherit;opacity:.9}
.b.media{padding:4px}
.b.media .meta{padding:2px 8px 2px}
.photo{display:block;border-radius:16px;max-width:240px;width:100%;max-height:300px;object-fit:cover}
.doc{display:flex;align-items:center;gap:10px;min-width:200px}
.doc .docic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.b.them .doc .docic{background:var(--purple-soft);color:var(--purple)}
.doc b,.ccard b,.loc b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc small,.ccard small,.loc small{display:block;font-size:12px;opacity:.75}
.loc{min-width:210px}
.map{position:relative;height:110px;border-radius:14px;margin:-2px -5px 8px;background:
  linear-gradient(90deg,transparent 47%,rgba(255,255,255,.55) 47% 53%,transparent 53%),
  linear-gradient(0deg,transparent 60%,rgba(255,255,255,.45) 60% 64%,transparent 64%),
  linear-gradient(35deg,transparent 30%,rgba(255,255,255,.35) 30% 33%,transparent 33%),
  linear-gradient(135deg,#BFE7D3,#A9D3F5);display:grid;place-items:center}
.map .pin{color:var(--red);filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));animation:pop .4s ease-out}
.ccard{display:flex;align-items:center;gap:10px;min-width:200px}
.ccard .av{width:40px;height:40px;font-size:14px}
.b.pay{background:linear-gradient(145deg,#0E9F62,#06704A);color:#fff;min-width:200px}
.b.them.pay{box-shadow:none}
.paycard{display:flex;flex-direction:column;gap:2px}
.paycard small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;opacity:.9}
.paycard b{font-family:var(--f-logo);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.paycard span{font-size:13px;opacity:.9}
.paycard em{font-style:normal;font-size:11px;font-weight:700;margin-top:4px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18);align-self:flex-start}
.e2e{align-self:center;text-align:center;padding:10px 0 4px;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
/* composer extras */
.attachbtn{color:var(--purple);background:var(--purple-soft);transition:transform .25s, background .2s}
.attachbtn.on{transform:rotate(45deg);background:var(--purple);color:#fff}
.attach{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-block:16px 10px;background:var(--surface);border-top:1px solid var(--line);animation:sheetup .28s cubic-bezier(.2,.8,.2,1)}
.attach button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--fg);animation:fadeUp .3s ease-out both}
.attach button span{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.14);transition:transform .15s}
.attach button:active span{transform:scale(.9)}
.replybar{display:flex;align-items:center;gap:8px;padding-block:8px 0;background:var(--surface);border-top:1px solid var(--line);animation:fadeUp .2s ease-out}
/* message sheet */
.msgsheet{align-items:stretch;text-align:left;gap:14px}
.msgsheet .grab{align-self:center}
.selprev{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:18px;background:var(--wash);font-size:14px;font-weight:600;color:var(--fg)}
.selprev span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.selprev.me{background:var(--purple);color:#fff}
.reacts{display:flex;justify-content:space-between;gap:6px;padding:6px;border-radius:99px;background:var(--wash)}
.reacts button{width:44px;height:44px;border-radius:50%;font-size:24px;display:grid;place-items:center;transition:transform .15s, background .15s}
.reacts button:active{transform:scale(1.25)}
.reacts button.on{background:var(--purple-soft)}
.acts{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--wash)}
.acts button{display:flex;align-items:center;gap:14px;padding:14px 16px;font-weight:700;font-size:15px;text-align:left;color:var(--fg)}
.acts button + button{border-top:1px solid var(--line)}
.acts button svg{color:var(--purple)}
.acts button:active{background:var(--surface-2)}
.acts .danger,.acts .danger svg{color:var(--red)}
.acts .av{width:34px;height:34px;font-size:12px}
/* pay */
.amt{font-family:var(--f-logo);font-weight:800;font-size:44px;font-variant-numeric:tabular-nums;color:var(--fg)}
.note{width:100%;border:0;background:var(--wash);color:var(--fg);border-radius:14px;padding:11px 14px;font:inherit;outline:none;text-align:center}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:320px}
.numpad button{height:48px;border-radius:16px;background:var(--wash);font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--fg)}
.numpad button:active{background:var(--purple-soft)}
.paybtn{width:100%;height:54px;border-radius:18px;background:var(--ok);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 24px rgba(14,159,98,.3)}
.paybtn:disabled{opacity:.4;box-shadow:none}
.callev{font:inherit;font-size:13px;font-weight:700;color:inherit}
.callev.missed{color:var(--bad)}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.theme.on{color:var(--purple)}
.theme .sw{position:relative;width:100%;height:58px;border-radius:18px;display:flex;align-items:flex-end;gap:6px;padding:10px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.theme.on .sw{box-shadow:0 0 0 2px var(--purple)}
.theme .sw i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.theme .sw b{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center}
.empty{padding-block:40px;text-align:center;color:var(--muted)}
/* ---- v6: chat menu, composer pill, panels ---- */
.evrow{display:flex;flex-direction:column;border-radius:14px}
.evrow.me{align-items:flex-end}.evrow.them{align-items:flex-start}.evrow.c{align-items:center}
.evrow.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{background:rgba(var(--acc-rgb),.18)}100%{background:transparent}}
mark{background:#FFE066;color:#1a1400;border-radius:3px;padding:0 1px}
.b a{color:inherit;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.b.them a{color:var(--purple)}
.sysmsg{max-width:86%;text-align:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);box-shadow:0 0 0 1px var(--line);padding:7px 12px;border-radius:12px;margin-block:4px}
.byname{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.ricon{display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ricon svg{width:14px;height:14px}
.badge.quiet{background:var(--muted)}
.menuveil{position:absolute;inset:0;z-index:13}
.menu{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:14;min-width:250px;max-width:calc(100% - 24px);background:var(--card);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.22),0 0 0 1px var(--line);padding:6px;transform-origin:top right;animation:menuin .22s cubic-bezier(.2,.8,.2,1)}
@keyframes menuin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:14px;font-size:15px;font-weight:600;text-align:left;color:var(--fg);animation:fadeUp .25s ease-out both}
.menu button svg{color:var(--purple);flex:none}
.menu button:active{background:var(--wash)}
.menu button.danger,.menu button.danger svg{color:var(--red)}
.menu .moreitem{border-top:1px solid var(--line);border-radius:0 0 14px 14px;margin-top:4px;justify-content:space-between}
.menu .moreitem svg{color:var(--muted)}
.overlay{z-index:12;background:var(--bg)}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-block:8px 18px}
.prof h2{margin:6px 0 0;font-family:var(--f-logo);font-size:26px;font-weight:800}
.prof > span:not(.commavatar){color:var(--muted);font-weight:600;font-size:13px}
.profacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;margin-top:10px}
.profacts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--wash);color:var(--purple);font-weight:700;font-size:12px}
.mstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.mstrip img,.mgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.memrow{display:flex;align-items:center;gap:12px;padding:12px 16px;font-weight:700;color:var(--fg);text-decoration:none}
.memrow + .memrow{border-top:1px solid var(--line)}
.memrow em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700}
.memrow .av{width:34px;height:34px;font-size:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--wash);width:100%}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--purple);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.field{width:100%;min-width:0;border:0;background:var(--wash);color:var(--fg);border-radius:14px;padding:12px 14px;font:inherit;outline:none}
.field:focus{box-shadow:0 0 0 2px var(--purple)}
.primary{width:100%;height:50px;border-radius:16px;background:var(--purple);color:#fff;font-weight:800;font-size:15px}
.primary:disabled{opacity:.4}
.primary.ghost{background:var(--wash);color:var(--purple)}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;transition:background .15s,border-color .15s}
.cbox.on{background:var(--purple);border-color:var(--purple)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.radio.on{border-color:var(--purple)}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--purple)}
.checkrow{display:flex;align-items:center;gap:10px;font-weight:700;padding-block:6px;color:var(--fg)}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:min(340px,calc(100% - 40px));background:var(--card);border-radius:26px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;animation:dlgin .22s cubic-bezier(.2,.8,.2,1)}
@keyframes dlgin{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}}
.dialog h3{margin:0;font-family:var(--f-logo);font-size:20px;font-weight:800;text-wrap:balance}
.dialog p{margin:0;color:var(--muted);font-size:14px}
.dlgbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.dlgbtns button{padding:11px 16px;border-radius:14px;font-weight:800;color:var(--purple)}
.dlgbtns button.danger{background:var(--red);color:#fff}
.sheettitle{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-logo);font-size:20px;font-weight:800;color:var(--fg)}
.sheettitle svg{color:var(--purple)}
.sheetnote{margin:0;color:var(--muted);font-size:13px;font-weight:500}
.msgsheet{max-height:86%;overflow-y:auto}
.walls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.walls button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.walls button.on{color:var(--purple)}
.wsw{position:relative;width:100%;height:88px;border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.walls button.on .wsw{box-shadow:0 0 0 2px var(--purple)}
.wsw i{position:absolute;height:14px;border-radius:8px}
.wsw .wb1{left:8px;top:16px;width:52%;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.wsw .wb2{right:8px;bottom:16px;width:44%;background:var(--purple)}
.inputpill{flex:1;min-width:0;display:flex;align-items:center;gap:2px;background:var(--wash);border-radius:26px;padding-inline:4px}
.composer .inputpill input{flex:1;min-width:0;border:0;background:none;color:var(--fg);padding:12px 4px;font:inherit;outline:none}
.pillbtn{width:38px;height:42px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:50%;transition:color .15s, transform .15s}
.pillbtn:active{transform:scale(.88)}
.pillbtn.on{color:var(--purple)}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding-block:10px;max-height:220px;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);animation:sheetup .25s cubic-bezier(.2,.8,.2,1)}
.emojis button{height:42px;font-size:24px;border-radius:12px;display:grid;place-items:center}
.emojis button:active{background:var(--wash);transform:scale(1.2)}
.blockedbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:12px;border-top:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted);font-size:14px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.b.preq{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--line);padding:8px}
.payreq{display:flex;flex-direction:column;gap:8px;width:230px;max-width:100%}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:16px;background:#FFFFFF}
.qr{display:block;max-width:100%}
.qr svg{width:100%;height:100%;display:block}
.qrtag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--purple);color:#fff}
.qrfallback{width:150px;height:150px;display:grid;place-items:center;color:#15122B}
.preqtext{display:flex;flex-direction:column;gap:2px;padding-inline:4px;font-size:14px}

/* ---- v9: home like a messenger ---- */

.crow .badge{background:var(--ok)}

.fabs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}

.joinbtn{padding:8px 12px;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;font-size:12px;flex:none;white-space:nowrap}

/* ---- v11 polish: spacing, alignment, motion ---- */
.fwd{animation:inR .28s cubic-bezier(.2,.8,.2,1)}
.back{animation:inL .28s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(12%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-8%);opacity:0}to{transform:none;opacity:1}}
.backdrop{animation:fadein .22s ease-out;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{animation:sheetup .32s cubic-bezier(.16,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.hbtn,.iconbtn,.roundbtn,.chip,.pillbtn,.callpick,.send,.listbtn,.acts button,.menu button,.profacts button{transition:transform .12s ease, background .15s ease}
.hbtn:active,.iconbtn:active,.roundbtn:active,.chip:active,.callpick:active{transform:scale(.92)}
.listbtn:active,.acts button:active,.profacts button:active{transform:scale(.985)}

.acts button,.menu button,.listbtn{gap:14px}
.acts button > svg,.menu button > svg,.memrow > span:first-child > svg{width:22px;height:22px;flex:none}

.listbtn .ic svg{width:20px;height:20px}
.menu button{padding:12px 14px;min-height:48px}
.menu{padding:6px}
/* consistent rows (calls, people) */
.row{gap:14px;padding-block:12px}
.row .av,.crow .av{width:50px;height:50px;font-size:17px}
.row .rname span:first-child{font-size:16px}
.row .rsub{font-size:14px;margin-top:3px;gap:5px}
.row .rsub svg{flex:none}
.rowmain{gap:14px}
.av .online{width:13px;height:13px;left:auto;right:1px;bottom:1px}
.thead .av{width:40px;height:40px;font-size:15px}
.thead{padding-block:8px;min-height:60px}
.thead .who b{font-size:16.5px;line-height:1.2}
.thead .who small{font-size:12.5px;margin-top:1px}
/* chips */
.chips{gap:8px}
.chip.out{padding:8px 15px;font-size:14px}
/* section labels */
.sect{padding-block:18px 8px;font-size:11.5px}
/* call events in a thread */
.callev{gap:12px;padding:8px 8px 8px 14px;max-width:92%}
.callev > svg{flex:none}
.cevtext{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0;text-align:left}
.cevtext b{font-size:13.5px}
.cevtext small{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}

/* bubbles: tidy rhythm */
.feed{gap:4px;padding-block:12px 16px}
.bwrap + .bwrap{margin-top:0}
.evrow.me + .evrow.them,.evrow.them + .evrow.me{margin-top:6px}
.b{padding:8px 12px 6px;line-height:1.35;box-shadow:0 1px 1.5px rgba(0,0,0,.06)}
.b .meta{margin-top:3px;gap:3px}
.daysep{margin-block:10px 6px}
.e2e{padding:6px 12px 4px;max-width:300px;margin-inline:auto;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);font-size:11.5px;line-height:1.35}
/* composer */

.send{width:48px;height:48px}
/* login */

/* misc */
.match .av .online{display:none}

.foot{padding-block:22px 18px;font-size:12px}

.badge{min-width:22px;height:22px;font-size:11.5px}
.empty{padding-block:36px;font-size:14px;line-height:1.5}

.profacts button{padding:14px 4px;gap:7px;justify-content:center}
.profacts button svg{width:22px;height:22px;flex:none}

/* ---- v12: smoother motion ---- */
.vt{animation:none}
::view-transition-group(*){animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
:root[data-vt="fwd"]::view-transition-old(root){animation-name:vtOutL}
:root[data-vt="fwd"]::view-transition-new(root){animation-name:vtInR}
:root[data-vt="back"]::view-transition-old(root){animation-name:vtOutR}
:root[data-vt="back"]::view-transition-new(root){animation-name:vtInL}
:root[data-vt="tab"]::view-transition-old(root){animation:vtFadeOut .16s ease-out both}
:root[data-vt="tab"]::view-transition-new(root){animation:vtFadeIn .22s ease-out both}
@keyframes vtOutL{to{transform:translateX(-10%);opacity:0}}
@keyframes vtInR{from{transform:translateX(14%);opacity:0}}
@keyframes vtOutR{to{transform:translateX(14%);opacity:0}}
@keyframes vtInL{from{transform:translateX(-10%);opacity:0}}
@keyframes vtFadeOut{to{opacity:0}}
@keyframes vtFadeIn{from{opacity:0;transform:translateY(6px)}}
.nav4{view-transition-name:mainnav}
.sheet.out{animation:sheetdown .19s ease-in forwards}
@keyframes sheetdown{to{transform:translateY(100%)}}
.backdrop.out{animation:fadeout .19s ease-in forwards}
@keyframes fadeout{to{opacity:0}}
.overlay.out{animation:ovout .19s ease-in forwards}
@keyframes ovout{to{transform:translateX(24%);opacity:0}}
.menu.out{animation:menuout .13s ease-in forwards}
@keyframes menuout{to{opacity:0;transform:scale(.92)}}
.sheet{touch-action:pan-y;will-change:transform}
.grab{width:44px;height:5px;margin-block:2px 4px;cursor:grab}
.crow{transition:background .2s ease, transform .45s cubic-bezier(.2,.8,.2,1)}
.crow.pressing{background:var(--wash);transform:scale(.985)}
.toast{left:0;right:0;margin-inline:auto;width:max-content;transform:none;animation:toastin .26s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:toastout .26s ease-in forwards}
@keyframes toastin{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes toastout{to{opacity:0;transform:translateY(8px) scale(.97)}}
.contactsheet{align-items:center;text-align:center}
.scroll{scroll-behavior:auto;-webkit-overflow-scrolling:touch}

/* ---- v13: premium interactions ---- */
.homebar{position:relative;z-index:2;background:var(--bg);transition:box-shadow .2s}
.homebar.scrolled{box-shadow:0 8px 14px -12px rgba(0,0,0,.35)}
.crow{position:relative;overflow:hidden}
.crowmain{position:relative;z-index:1;background:var(--bg);touch-action:pan-y}
.crow.pressing .crowmain,.crow.held .crowmain{background:var(--wash)}
.swbg{position:absolute;top:0;bottom:0;display:none;align-items:center;gap:8px;padding-inline:22px;color:#fff;font-weight:800;font-size:13px}
.swbg svg{width:22px;height:22px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.swbg.r{left:0;right:0;justify-content:flex-start;background:var(--purple)}
.swbg.l{left:0;right:0;justify-content:flex-end;background:var(--ok)}
.crow[data-sw="r"] .swbg.r,.crow[data-sw="l"] .swbg.l{display:flex}
.crow.go .swbg svg{transform:scale(1.25)}
.toast.hasact{display:flex;align-items:center;gap:14px;padding-right:8px;white-space:nowrap}
.toast button{color:#B9F5D8;font-weight:800;padding:6px 10px;border-radius:10px}
.toast button:active{background:rgba(255,255,255,.12)}
.burst{position:absolute;left:50%;top:50%;font-size:44px;pointer-events:none;transform:translate(-50%,-50%);animation:burst .75s cubic-bezier(.2,.9,.3,1.3) forwards;z-index:2}
.bwrap.me .burst{left:auto;right:30%}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}35%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-130%) scale(.9);opacity:0}}
.react{animation:pop .3s cubic-bezier(.2,.9,.3,1.4)}
.focusveil{position:absolute;inset:0;z-index:28;background:rgba(14,11,31,.32);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fadein .18s ease-out}
.focusveil.out{animation:fadeout .17s ease-in forwards}
.focus{position:absolute;z-index:29;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;animation:focusin .24s cubic-bezier(.2,.9,.3,1.15)}
.focus.me{align-items:flex-end}.focus.them{align-items:flex-start}
.focus.out{animation:focusout .17s ease-in forwards}
@keyframes focusin{from{opacity:0;transform:scale(.94)}}
@keyframes focusout{to{opacity:0;transform:scale(.96)}}
.focusreacts{background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:99px;padding:6px;gap:2px}

.focusacts button{display:flex;align-items:center;justify-content:space-between;flex-direction:row-reverse;gap:12px;width:100%;padding:13px 16px;font-weight:600;font-size:15px;color:var(--fg);text-align:left}

.focusacts button span{flex:1}
.focusacts button svg{color:var(--purple);width:20px;height:20px;flex:none}

.tolatest{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--fg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.16),0 0 0 1px var(--line);animation:pop .25s ease-out}
.tolatest .badge{position:absolute;top:-6px;right:-4px;background:var(--ok)}
.switch{margin-left:auto;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--ok)}

/* ---- v14: profile & customization ---- */
.avimg{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}

.mehero-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mehero-text b{font-family:var(--f-logo);font-size:23px;font-weight:800;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehero-text span{font-size:14px;color:var(--fg);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehero-text small{font-size:12px;color:var(--muted);font-weight:600}
.idstrip{margin-top:12px;padding:14px;border-radius:22px;background:var(--wash);display:flex;flex-direction:column;gap:10px}
.idstrip-head{display:flex;align-items:center;justify-content:space-between}
.idstrip-acts{display:flex;gap:8px;flex-wrap:wrap}
.stat{margin-top:12px}
.listbtn{min-height:56px}
.listbtn > svg:last-child{color:var(--muted);margin-left:2px}
.listbtn em{margin-left:auto;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listbtn.danger,.listbtn.danger .ic{color:var(--red)}
.lsub{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.verline{text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;padding-bottom:20px;margin:0}
.verline span{display:inline-flex;align-items:center;gap:4px;color:var(--ok)}
.avedit{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:8px 4px}
.avpick{position:relative;border-radius:50%}
.avcam{position:absolute;right:2px;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.avbtns{display:flex;gap:8px}
.hues{display:flex;gap:10px;flex-wrap:wrap}
.hue{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s}
.hue.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--purple)}
.hue:active{transform:scale(.9)}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px 16px;border-radius:26px;background:var(--wash)}
.qrcard b{font-family:var(--f-logo);font-size:20px}
.preview{border-radius:20px;padding:8px 14px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.preview .bwrap{max-width:82%}
/* bubble shape + text size, applied app-wide */
:root[data-bubble="soft"] .b{border-radius:14px}
:root[data-bubble="soft"] .b.me{border-bottom-right-radius:4px}
:root[data-bubble="soft"] .b.them{border-bottom-left-radius:4px}
:root[data-bubble="sharp"] .b{border-radius:6px}
:root[data-bubble="sharp"] .b.me,:root[data-bubble="sharp"] .b.them{border-bottom-right-radius:6px;border-bottom-left-radius:6px}
:root[data-text="sm"] .b{font-size:13.5px}
:root[data-text="lg"] .b{font-size:17px}
:root[data-text="lg"] .b .meta{font-size:11.5px}

/* ---- v15: native feel ---- */
.subhead{position:relative;z-index:2;transition:box-shadow .2s;min-height:56px}
.subhead.scrolled{box-shadow:0 8px 14px -12px rgba(0,0,0,.35)}
.subtitle{flex:1;font-size:17px;transition:opacity .18s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigtitle{margin:0 0 14px;font-family:var(--f-logo);font-weight:800;font-size:30px;letter-spacing:-.01em;transition:opacity .18s,transform .18s;padding-top:4px;line-height:1.1}
.overlay{will-change:transform}
.switch{cursor:pointer;touch-action:pan-y;outline-offset:3px}
.switch i{will-change:transform}
.sdot{display:inline-block;width:9px;height:9px;border-radius:9px}
.chip.out svg{width:15px;height:15px}
.mehead{transition:padding .2s}
.mehead h1{transition:opacity .18s,transform .18s}
.mehead-mini{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);display:flex;align-items:center;gap:8px;font-size:15px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:55%}
.mehead-mini b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehead.compact{box-shadow:0 8px 14px -12px rgba(0,0,0,.35);position:relative;z-index:2;background:var(--bg)}
.mehead.compact h1{opacity:0;transform:translateY(-6px)}
.mehead.compact .mehead-mini{opacity:1;transform:translateX(-50%)}
.ptr{display:flex;align-items:flex-end;justify-content:center;overflow:hidden;height:0;transition:height .25s cubic-bezier(.2,.8,.2,1);color:var(--purple)}
.ptr.on{transition:none}
.ptrspin{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.14),0 0 0 1px var(--line);margin-bottom:8px}
.ptrspin svg{width:18px;height:18px}
.ptrspin.go{animation:rot .7s linear infinite}
.scroll{overscroll-behavior-y:contain;touch-action:pan-y}
.listbtn{cursor:pointer}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const fmtDur = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
const sameDay = (a,b) => new Date(a).toDateString()===new Date(b).toDateString();
const fmtWhen = t => sameDay(t,Date.now()) ? fmtTime(t) : sameDay(t,Date.now()-d) ? "Yesterday" : new Date(t).toLocaleDateString([], {weekday:"short"});
const dayLabel = t => sameDay(t,Date.now()) ? "Today" : sameDay(t,Date.now()-d) ? "Yesterday" : new Date(t).toLocaleDateString([], {weekday:"long", day:"numeric", month:"short"});

/* ---------- Circular symbol pad (the daily pad) ---------- */
function SymbolPad({onSym, onDel, onClear, size="min(76vw, 320px, 44vh)", order, spinKey}) {
  const [hit, setHit] = useState(-1);
  const held = useRef(null);
  const press = s => { vibe(8); setHit(s); setTimeout(()=>setHit(-1),120); onSym(s); };
  useEffect(()=>{
    const kb = e => {
      const map = {"-":0,"+":1,"x":2,"*":2,"=":3,"o":4,"[":5,".":6,"]":7};
      if (e.target.tagName==="INPUT") return;
      if (map[e.key]!==undefined) press(map[e.key]);
      if (e.key==="Backspace") onDel();
    };
    window.addEventListener("keydown", kb); return ()=>window.removeEventListener("keydown", kb);
  });
  return <div key={spinKey} className={"dial"+(spinKey?" spin":"")} style={{"--size":size}} role="group" aria-label="Gloobal symbol pad">
    {order.map((s,i)=>{
      const a = (i/8)*Math.PI*2;
      return <button key={s} className={"sym"+(hit===s?" hit":"")} aria-label={`Symbol ${SYMS[s]}`}
        style={{left:`${50+32*Math.sin(a)}%`, top:`${50-32*Math.cos(a)}%`, color:SYM_COLOR[s]}}
        onClick={()=>press(s)}>{SYMS[s]}</button>;
    })}
    <button className="center" aria-label="Delete (hold to clear)"
      onClick={()=>{ vibe(12); onDel(); }}
      onPointerDown={()=>{ held.current = setTimeout(()=>{ vibe(30); onClear(); held.current="done"; }, 600); }}
      onPointerUp={()=>{ if (held.current!=="done") clearTimeout(held.current); }}
      onPointerLeave={()=>{ if (held.current!=="done") clearTimeout(held.current); }}>{I.x}</button>
  </div>;
}
function Slots({val, hidden}) {
  return <div className="slots" aria-label={`${val.length} of ${ID_LEN} symbols`}>
    {Array.from({length:ID_LEN}).map((_,i)=>{
      const s = val[i];
      return <div key={i+"-"+(s??"e")} className={"slot"+(s===undefined?" blank":" pop")+(i===val.length?" cur":"")} style={s!==undefined?{color:SYM_COLOR[s]}:null}>
        {s===undefined ? <span className="hid" style={{opacity:.25}}/> : hidden ? <span className="hid"/> : SYMS[s]}
      </div>;
    })}
  </div>;
}

/* ---------- Login: splash → ID → success ---------- */
const FLAGS = [["🇳🇴","5%","4%"],["🇯🇵","88%","10%"],["🇧🇷","3%","48%"],["🇮🇳","90%","44%"],["🇳🇬","4%","70%"],["🇩🇪","90%","62%"]];
function Login({onIn}) {
  const [stage, setStage] = useState("splash");     // splash | id | ok
  const [val, setVal] = useState([]);
  const [hidden, setHidden] = useState(true);
  const [order, setOrder] = useState(PAD_ORDER);
  const [spin, setSpin] = useState(0);
  const [shake, setShake] = useState(0);
  const full = val.length===ID_LEN;
  const isMe = full && val.every((s,i)=>s===ME.sec[i]);
  useEffect(()=>{ const t = setTimeout(()=>setStage("id"), 1300); return ()=>clearTimeout(t); }, []);
  // a recognised ID signs in by itself
  useEffect(()=>{ if (!isMe) return; vibe(20); const t = setTimeout(()=>{ setStage("ok"); setTimeout(onIn, 1000); }, 450); return ()=>clearTimeout(t); }, [isMe]);
  const add = s => setVal(v => v.length<ID_LEN ? [...v,s] : v);
  const demo = () => { setVal([]); ME.sec.forEach((s,i)=>setTimeout(()=>{ vibe(5); setVal(v=>[...v,s]); }, 70*(i+1))); };
  const shuffle = () => { setOrder(o=>[...o].sort(()=>Math.random()-.5)); setSpin(x=>x+1); vibe(15); };
  const create = () => { vibe(20); setStage("ok"); setTimeout(onIn, 1000); };
  const status = isMe ? <span className="lstat ok">✓ Account found · signing you in</span>
    : full ? <span className="lstat new">No account with this ID yet</span>
    : null;

  if (stage==="splash") return <div className="screen login splash" onClick={()=>setStage("id")}>
    <div className="splashmark"><HellooMark size={96}/></div>
    <div className="splashname">Helloo</div>
    <div className="splashby">by <Logo size={14}/></div>
    <div className="splashfoot">{I.lock} Free calls and messages, every country</div>
  </div>;

  if (stage==="ok") return <div className="screen login splash">
    <svg className="okring" width="110" height="110" viewBox="0 0 110 110" aria-hidden="true">
      <circle cx="55" cy="55" r="48" fill="none" stroke="var(--line)" strokeWidth="6"/>
      <circle className="okarc" cx="55" cy="55" r="48" fill="none" stroke="var(--g-green)" strokeWidth="6" strokeLinecap="round"/>
      <path className="okcheck" d="M36 56l13 13 25-27" fill="none" stroke="var(--g-green)" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
    <div className="splashname" style={{fontSize:28}}>{isMe ? `Welcome back, ${ME.name}` : "Your Gloobal ID is ready"}</div>
    <div className="splashfoot" style={{position:"static"}}>Opening Helloo…</div>
  </div>;

  return <div className="screen login fade">
    <header className="top pad" style={{paddingTop:16,position:"relative"}}>
      <span style={{width:46}}/>
      <div style={{flex:1,textAlign:"center"}}><Logo size={28} sub="ID"/></div>
      <button className="roundbtn" aria-label="Fill demo ID" onClick={demo}>{I.help}</button>
    </header>
    <div className="scroll pad lbody">
      <div className={"idcard"+(shake?" shake":"")} key={shake}>
        <span className="tag">LOGIN</span>
        <button className="eye" onClick={()=>setHidden(x=>!x)} aria-label={hidden?"Show symbols":"Hide symbols"}>{hidden?I.eyeOff:I.eye}</button>
        <Slots val={val} hidden={hidden}/>
      </div>
      <div className="lstatrow">{status}</div>
      <div className="lpad">
        <SymbolPad order={order} spinKey={spin} onSym={add} onDel={()=>setVal(v=>v.slice(0,-1))} onClear={()=>setVal([])} size="min(60vw, 248px, 34vh)"/>
      </div>
      <div className="lfoot">
        {full && !isMe
          ? <><button className="inbtn sm" onClick={create} aria-label="Create account">NEW</button><button className="textbtn" onClick={()=>{ setVal([]); setShake(s=>s+1); }}>Try again</button></>
          : <><button className="inbtn sm" disabled={!isMe} aria-label="Sign in">IN</button><button className="textbtn" onClick={demo}>Use demo ID</button></>}
      </div>
    </div>
  </div>;
}

/* ---------- QR code (qrcode-generator) ---------- */
function QR({text, size=150}) {
  const svg = useMemo(()=>{
    try { const q = window.qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
    catch(e) { return null; }
  }, [text]);
  if (!svg) return <div className="qrfallback">{I.qr}</div>;
  return <div className="qr" style={{width:size, height:size}} dangerouslySetInnerHTML={{__html:svg}}/>;
}

const veilClose = (e, fn) => { const m = e.currentTarget.nextElementSibling; if (m) { m.classList.add("out"); setTimeout(fn, 130); } else fn(); };
const canVT = () => !!document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches;
const vt = (fn, kind) => {
  if (!canVT()) return fn();
  const r = document.documentElement; r.dataset.vt = kind;
  try { const t = document.startViewTransition(()=>ReactDOM.flushSync(fn)); t.finished.finally(()=>{ if (r.dataset.vt===kind) delete r.dataset.vt; }); }
  catch(e) { delete r.dataset.vt; fn(); }

function useEdgeBack(ref, onBack) {
  const st = useRef(null);
  const down = e => { const r = ref.current; if (!r) return; if (e.clientX - r.getBoundingClientRect().left < 28) st.current = {x:e.clientX, y:e.clientY, dx:0, id:e.pointerId}; };
  const move = e => { const d = st.current; if (!d) return; const dx = e.clientX - d.x; if (Math.abs(e.clientY - d.y) > 40 && dx < 20) { st.current = null; ref.current.style.transform = ""; return; }
    d.dx = Math.max(0, dx); if (d.dx > 6) { try { ref.current.setPointerCapture(d.id); } catch(x){} ref.current.style.transition = "none"; ref.current.style.transform = `translateX(${d.dx*.9}px)`; ref.current.style.boxShadow = "-8px 0 30px rgba(0,0,0,.18)"; } };
  const up = () => { const d = st.current; st.current = null; if (!d) return; const r = ref.current; if (!r) return;
    const w = r.getBoundingClientRect().width;
    if (d.dx > Math.min(110, w*.3)) { r.style.transition = "transform .18s ease-in"; r.style.transform = "translateX(100%)"; vibe(6); setTimeout(onBack, 170); }
    else { r.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)"; r.style.transform = ""; setTimeout(()=>{ if (r) { r.style.transition = ""; r.style.boxShadow = ""; } }, 230); } };
  return {onPointerDown:down, onPointerMove:move, onPointerUp:up, onPointerCancel:up};
}
