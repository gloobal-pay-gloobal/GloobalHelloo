/* ---------- App ---------- */
function App(){
  const [stage, setStage] = useState("login");
  const [theme, setTheme] = useState(()=>{ try { return localStorage.getItem("helloo-theme") || ""; } catch(e){ return ""; } });
  const [profile, setProfile] = useState(loadProfile);
  useEffect(()=>{
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch(e){}
    const r = document.documentElement; r.dataset.bubble = profile.bubble; r.dataset.text = profile.textSize; ME.name = profile.name; DEFAULT_WALL = profile.wall;
  }, [profile]);
  useEffect(()=>{
    const r = document.documentElement;
    if (theme) r.setAttribute("data-gtheme", theme); else r.removeAttribute("data-gtheme");
    try { theme ? localStorage.setItem("helloo-theme", theme) : localStorage.removeItem("helloo-theme"); } catch(e){}
  }, [theme]);
  const [threads, setThreads] = useState(SAVED?.threads || SEED);
  const [unread, setUnread] = useState(SAVED?.unread || {amara:2, lukas:1});
  const [settings, setSettings] = useState(SAVED?.settings || {});
  const [lists, setLists] = useState(SAVED?.lists || ["Family","Work"]);
  const [communities, setCommunities] = useState(SAVED?.communities || []);
  const [scheduled, setScheduled] = useState(SAVED?.scheduled || []);
  const [devices, setDevices] = useState(SAVED?.devices || []);
  const [page, setPage] = useState(null);          // broadcast | linked | payments
  const [commSheet, setCommSheet] = useState(false);
  const [addGroupFor, setAddGroupFor] = useState(null);
  const schedRef = useRef(scheduled); schedRef.current = scheduled;
  const [, setGroupsV] = useState(0);
  const [tab, setTab] = useState("chats");
  const [open, setOpen] = useState(null);
  const [dir, setDir] = useState("fwd");
  const [call, setCall] = useState(null);
  const [incoming, setIncoming] = useState(null);
  const [typing, setTyping] = useState({});
  const [toast, setToast] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [groupSheet, setGroupSheet] = useState(null);
  const openRef = useRef(null); openRef.current = open;
  const setRef = useRef(settings); setRef.current = settings;

  const getSet = id => ({...DEF_SET, ...(settings[id]||{})});
  const setSet = (id, patch) => setSettings(s => ({...s, [id]: {...DEF_SET, ...(s[id]||{}), ...patch}}));
  const muted = id => ((setRef.current[id]||{}).mute||0) > Date.now();
  const blocked = id => !!(setRef.current[id]||{}).blocked;

  // save everything on this device
  const saveWarned = useRef(false);
  useEffect(()=>{
    const t = setTimeout(()=>{
      try { localStorage.setItem(STORE, JSON.stringify({threads, unread, settings, lists, communities, scheduled, devices, groups:CONTACTS.filter(c=>c.group||c.broadcast)})); }
      catch(e) { if (!saveWarned.current) { saveWarned.current = true; say("Storage is full. Older photos won't be kept after reload"); } }
    }, 400);
    return ()=>clearTimeout(t);
  }, [threads, unread, settings, lists, communities, scheduled, devices]);

  // disappearing messages: sweep expired ones
  useEffect(()=>{
    const t = setInterval(()=>{
      const now = Date.now();
      setThreads(th => {
        let changed = false; const out = {};
        for (const [id, evs] of Object.entries(th)) { const kept = evs.filter(e => !e.exp || e.exp > now); if (kept.length !== evs.length) changed = true; out[id] = kept; }
        return changed ? out : th;
      });
      const due = schedRef.current.find(x=>!x.fired && x.at<=now);
      if (due) { setScheduled(l=>l.map(x=>x.id===due.id?{...x,fired:true}:x)); vibe([40,60,40]); setIncoming({id:due.chat, kind:due.kind, sched:due.title}); }
    }, 2000);
    return ()=>clearInterval(t);
  }, []);

  const push = (id, ev) => setThreads(t => ({...t, [id]:[...(t[id]||[]), ev]}));
  const patchMine = (id, st) => setThreads(t => ({...t, [id]: (t[id]||[]).map(e => e.from==="me" && e.st && e.st!=="read" ? {...e, st} : e)}));
  const toastT = useRef();
  const say = (msg, act) => { setToast({m:msg, act, out:false}); clearTimeout(toastT.current); clearTimeout(toastT.out); toastT.out = setTimeout(()=>setToast(t=>t&&{...t,out:true}), 2150); toastT.current = setTimeout(()=>setToast(null), 2420); };
  const expFor = id => { const s = (setRef.current[id]||{}).disappear||0; return s ? {exp: Date.now()+s*1000} : {}; };
  const incomingMsg = (id, ev) => {
    push(id, {...ev, from:"them", t:Date.now(), ...expFor(id)});
    if (!muted(id)) sfx.recv();
    if (openRef.current!==id) { setUnread(u=>({...u,[id]:(u[id]||0)+1})); if (!muted(id)) say(C[id].group ? `New message in ${C[id].name}` : `New message from ${first(C[id].name)}`); }
  };

  const reply = (id, ev) => {
    if (blocked(id)) return;   // blocked contacts never receive or answer
    if (C[id].ann || C[id].broadcast) { setTimeout(()=>patchMine(id,"delivered"), 500); setTimeout(()=>patchMine(id,"read"), 1800); return; }
    setTimeout(()=>patchMine(id,"delivered"), 500);
    const c = C[id];
    const by = c.group ? c.members[Math.floor(Math.random()*c.members.length)] : null;
    setTimeout(()=>{ patchMine(id,"read"); setTyping(x=>({...x,[id]: by ? first(C[by].name) : true})); }, 1300);
    setTimeout(()=>{
      setTyping(x=>({...x,[id]:false}));
      if (blocked(id)) return;
      if (ev && ev.k==="payreq") {
        setThreads(t => ({...t, [id]: t[id].map(e => e.t===ev.t && e.k==="payreq" ? {...e, paid:true} : e)}));
        incomingMsg(id, {k:"pay", amt:ev.amt, note:"Paid your request", by});
      } else incomingMsg(id, {k:"msg", text:REPLIES[Math.floor(Math.random()*REPLIES.length)], by});
    }, 3000 + Math.random()*1200);
  };
  const post = (id, ev) => {
    if (!ev.bc) sfx.send();
    const full = {...ev, from:"me", t:Date.now(), st:"sent", ...expFor(id)}; push(id, full); reply(id, full);
    if (C[id].broadcast) C[id].members.forEach((m,i)=>setTimeout(()=>post(m, {...ev, bc:true}), 120*(i+1)));   // a broadcast lands as a normal chat for each person
  };
  const sys = (id, text) => push(id, {k:"sys", text, t:Date.now()});

  const startCall = (id, kind, ppl) => {
    if (blocked(id)) return say(`Unblock ${first(C[id].name)} to call`);
    vibe(15); setSheet(null); setIncoming(null); setCall({id, kind, people:ppl||null, dir:"out", state:"ringing", start:null, min:false});
  };
  const acceptIncoming = () => { const {id, kind, sched} = incoming; setIncoming(null); vibe(15); setCall({id, kind, dir: sched?"out":"in", state: sched?"ringing":"live", start: sched?null:Date.now(), min:false}); };
  const declineIncoming = () => { if (incoming.sched) { setIncoming(null); return say("Scheduled call skipped"); } push(incoming.id, {k:"call", dir:"missed", kind:incoming.kind, dur:0, t:Date.now()}); setIncoming(null); say("Call declined · they'll see a missed call"); };
  const endCall = () => {
    const dur = call.start ? Math.round((Date.now()-call.start)/1000) : 0;
    push(call.id, {k:"call", dir: dur ? call.dir : "out", kind:call.kind, dur, t:Date.now()});
    setCall(null); vibe(25); say(dur ? `Call ended · ${fmtDur(dur)} · ₹0.00` : "Call cancelled");
  };
  useEffect(()=>{
    if (call?.state!=="ringing") return;
    const t = setTimeout(()=>setCall(c=>c&&({...c, state:"live", start:Date.now()})), 2600);
    return ()=>clearTimeout(t);
  }, [call?.state]);

  useEffect(()=>{
    const onPop = () => {
      if (sheet) return setSheet(null);
      if (call && !call.min) return setCall(c=>({...c,min:true}));
      if (openRef.current) { setDir("back"); setOpen(null); }
    };
    window.addEventListener("popstate", onPop); return ()=>window.removeEventListener("popstate", onPop);
  }, [sheet, call]);

  const [openInit, setOpenInit] = useState(null);
  const openThread = (id, init) => { vt(()=>{ setOpenInit(init||null); setSheet(null); setGroupSheet(null); setDir(canVT()?"vt":"fwd"); setOpen(id); setUnread(u=>({...u,[id]:0})); }, "fwd"); try { history.pushState(null, ""); } catch(e){} };
  const closeThread = () => vt(()=>{ setDir(canVT()?"vt":"back"); setOpen(null); }, "back");
  const ORDER = ["chats","dial","contacts","comm","calls","me"];
  const goTab = t => { if (t===tab) return; const d = ORDER.indexOf(t) > ORDER.indexOf(tab) ? "fwd":"back"; vibe(5); vt(()=>{ setDir(canVT()?"vt":d); setTab(t); }, "tab"); };

  const createGroup = (name, members, opt={}) => {
    const id = "g-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const g = {id, name, group:true, members, flag:opt.ann?"📣":"👥", country:`${members.length+1} members`, hue:Math.floor(Math.random()*360), online:false, sec:ME.sec, phone:"", ...(opt.comm?{comm:opt.comm}:{}), ...(opt.ann?{ann:true}:{})};
    CONTACTS.push(g); C[id] = g; setGroupsV(v=>v+1);
    const intro = opt.ann ? `Only admins can send announcements in ${opt.commName}. Members receive every update.` : `You created the group "${name}" with ${members.map(m=>first(C[m].name)).join(" and ")}`;
    setThreads(t => ({...t, [id]:[{k:"sys", text:intro, t:Date.now()}]}));
    if (!opt.silent) { say(`Group "${name}" created`); openThread(id); }
    if (!opt.ann) setTimeout(()=>incomingMsg(id, {k:"msg", text:"Helloo everyone 👋", by:members[0]}), 2500+Math.random()*800);
    return id;
  };
  const createCommunity = (name, desc, members) => {
    const cid = "c-"+Date.now().toString(36);
    const ann = createGroup(`${name} Announcements`, members, {comm:cid, ann:true, silent:true, commName:name});
    const gen = createGroup(`${name} General`, members, {comm:cid, silent:true});
    setCommunities(l=>[...l, {id:cid, name, desc, members, hue:COMM_HUES[l.length%COMM_HUES.length], ann, groups:[gen]}]);
    setCommSheet(false); setPage(null); setOpen(null); goTab("comm"); say(`Community "${name}" created`);
  };
  const addCommGroup = (cid, name) => {
    const cm = communities.find(x=>x.id===cid);
    const gid = createGroup(name, cm.members, {comm:cid, silent:true});
    setCommunities(l=>l.map(x=>x.id===cid?{...x, groups:[...x.groups, gid]}:x)); setAddGroupFor(null); say(`Group "${name}" added to ${cm.name}`);
  };
  const createBroadcast = (name, members) => {
    const id = "b-"+Date.now().toString(36);
    const b = {id, name, broadcast:true, members, flag:"📡", country:`${members.length} recipients`, hue:200, online:false, sec:ME.sec, phone:""};
    CONTACTS.push(b); C[id] = b; setGroupsV(v=>v+1);
    setThreads(t => ({...t, [id]:[{k:"sys", text:`You created a broadcast list with ${members.length} recipient${members.length===1?"":"s"}. Messages go to each person as a private chat.`, t:Date.now()}]}));
    setPage(null); openThread(id); say(`Broadcast list "${name}" created`);
  };
  const scheduleCall = (chat, {title, at, kind}) => {
    const id = "s-"+Date.now().toString(36);
    setScheduled(l=>[...l, {id, chat, title, at, kind}]);
    post(chat, {k:"sched", sid:id, title, at, kind});
    say(`${title} scheduled ${until(at)}`);
  };

  const exportChat = async id => {
    const c = C[id];
    const lines = (threads[id]||[]).map(e => {
      const when = new Date(e.t).toLocaleString();
      if (e.k==="sys") return `[${when}] ${e.text}`;
      if (e.k==="call") return `[${when}] ${callLabel(e)}`;
      const who = e.from==="me" ? ME.name : e.by ? C[e.by].name : c.name;
      return `[${when}] ${who}: ${evSummary(e)}`;
    });
    const data = `Helloo chat with ${c.name}\nExported ${new Date().toLocaleString()}\n\n` + lines.join("\n") + "\n";
    let dl = null;
    try { dl = await window.claude?.use?.("downloads"); } catch(e) {}
    if (dl) {
      try { await dl.save({filename:`Helloo chat with ${c.name}.txt`, data}); say("Chat exported"); return; }
      catch(e) { if (e && e.code==="declined") return say("Export cancelled"); }
    }
    try { await navigator.clipboard.writeText(data); say("Saving isn't available here, so the chat was copied instead"); }
    catch(e) { say("Export isn't available in this view"); }
  };

  const totalUnread = Object.entries(unread).reduce((a,[id,n])=>a+(muted(id)?0:n),0);
  const missed = Object.values(threads).flat().filter(e=>e.k==="call"&&e.dir==="missed"&&e.t>T0-d).length;

  if (stage==="login") return <div className="app"><Login onIn={()=>{ setStage("app"); setDir("fwd"); }}/></div>;

  const oc = open && C[open];
  return <div className="app">
    {oc
      ? <Thread key={"t-"+open} initView={openInit} cls={dir} c={oc} events={threads[open]||[]} typing={typing[open]} onBack={closeThread} say={say}
          set={getSet(open)} onSet={p=>setSet(open,p)} lists={lists} setLists={setLists}
          onPost={ev=>post(open,ev)} onSys={t=>sys(open,t)} onCall={k=>startCall(open,k)}
          onPatch={(i,p)=>setThreads(t=>({...t,[open]:t[open].map((e,j)=>j===i?{...e,...p}:e)}))}
          onDelete={i=>setThreads(t=>({...t,[open]:t[open].filter((_,j)=>j!==i)}))}
          onClear={keepStar=>setThreads(t=>({...t,[open]:keepStar?t[open].filter(e=>e.star):[]}))}
          onForward={(e,to)=>{ const {react,star,reply,exp,by,...rest}=e; post(to,{...rest,fwd:true}); say(`Forwarded to ${first(C[to].name)}`); }}
          onExport={()=>exportChat(open)} onNewGroup={()=>setGroupSheet({pre:oc.group?[]:[oc.id]})} onCallPeople={(k,p)=>startCall(open,k,p)} onSchedule={x=>scheduleCall(open,x)} />
      : <div key={"tab-"+tab} className={"screen "+dir} style={{bottom:"auto",height:"100%"}}>
          <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column"}}>
            {tab==="chats" && <Chats threads={threads} unread={unread} typing={typing} getSet={getSet} setSet={setSet} lists={lists} setLists={setLists} say={say}
                onOpen={openThread} onCall={startCall} onNew={()=>goTab("contacts")} onGroup={()=>setGroupSheet({pre:[]})} onPad={()=>goTab("dial")}
                onPayTo={id=>openThread(id,"pay")} onSendTo={(id,ev)=>{ post(id,ev); openThread(id); }}
                onMarkRead={(id,n)=>setUnread(u=>({...u,[id]:n}))}
                onDeleteChat={id=>{ setThreads(t=>({...t,[id]:[]})); setUnread(u=>({...u,[id]:0})); if (C[id].group) { const i=CONTACTS.findIndex(x=>x.id===id); if(i>=0) CONTACTS.splice(i,1); delete C[id]; setGroupsV(v=>v+1); } }}
                onSettings={()=>goTab("me")} onLock={()=>{ setStage("login"); }} onPage={setPage} onNewCommunity={()=>setCommSheet(true)} />}
            {tab==="calls" && <Calls threads={threads} onCall={startCall} onInfo={setSheet} onDial={()=>goTab("dial")} scheduled={scheduled}
                onCancelSched={id=>{ setScheduled(l=>l.filter(x=>x.id!==id)); say("Scheduled call cancelled"); }} />}
            {tab==="comm" && <Communities communities={communities} threads={threads} onOpen={openThread} onNew={()=>setCommSheet(true)} onAddGroup={setAddGroupFor} />}
            {tab==="dial" && <Dial onCall={startCall} onOpen={openThread} threads={threads} say={say} />}
            {tab==="contacts" && <Contacts onInfo={setSheet} onGroup={()=>setGroupSheet({pre:[]})} />}
            {tab==="me" && <Me say={say} profile={profile} setProfile={setProfile} theme={theme} setTheme={t=>{ setTheme(t); vibe(10); say(`${(THEMES.find(x=>x.id===t)||THEMES[0]).name} theme on`); }} threads={threads} onLock={()=>{ setStage("login"); setTab("chats"); }}
                onReset={()=>{ try { localStorage.removeItem(STORE); localStorage.removeItem(PROFILE_KEY); } catch(e){} location.reload(); }}
                simCall={(kind)=>{ goTab("chats"); setTimeout(()=>{ if (blocked("lukas")) return say("Blocked: Lukas tried to call"); vibe([40,60,40]); setIncoming({id:"lukas", kind}); }, 700); }}
                simMsg={()=>{ goTab("chats"); setTimeout(()=>incomingMsg("amara",{k:"msg",text:"Landed safely ✈️"}), 500); }} />}
          </div>
          <nav className="nav4" aria-label="Main">
            {[["chats","Chats",I.chat,totalUnread],["comm","Communities",I.community,0],["calls","Calls",I.phone,missed],["me","Me",I.me,0]].map(([k,l,ic,n])=>
              <button key={k} className={"tab"+(tab===k||(k==="chats"&&(tab==="dial"||tab==="contacts"))?" on":"")} onClick={()=>goTab(k)} aria-current={tab===k?"page":undefined}>
                <span className="ti">{ic}{n>0 && (k==="chats" ? <i className="tcount">{n}</i> : <span className="tdot"/>)}</span>{l}
              </button>)}
          </nav>
        </div>}

    {sheet && <SheetShell label={C[sheet].name} cls="contactsheet" onClose={()=>setSheet(null)}>
      <ContactSheet c={C[sheet]} onMsg={()=>openThread(sheet)} onCall={k=>startCall(sheet,k)} />
    </SheetShell>}
    {page==="broadcast" && <BroadcastScreen threads={threads} onBack={()=>setPage(null)} onOpen={id=>{ setPage(null); openThread(id); }} onCreate={createBroadcast}/>}
    {page==="linked" && <LinkedScreen devices={devices} setDevices={setDevices} onBack={()=>setPage(null)} say={say}/>}
    {page==="payments" && <PaymentsScreen threads={threads} onBack={()=>setPage(null)} say={say} onPayTo={id=>{ setPage(null); openThread(id,"pay"); }} onRequestTo={id=>{ setPage(null); openThread(id,"payreq"); }}/>}
    {commSheet && <CommunitySheet onClose={()=>setCommSheet(false)} onCreate={createCommunity}/>}
    {addGroupFor && <AddGroupSheet comm={communities.find(x=>x.id===addGroupFor)} onClose={()=>setAddGroupFor(null)} onCreate={n=>addCommGroup(addGroupFor, n)}/>}
    {groupSheet && <GroupSheet pre={groupSheet.pre} onClose={()=>setGroupSheet(null)} onCreate={(n,m)=>{ setGroupSheet(null); createGroup(n,m); }}/>}
    {incoming && !call && <Incoming c={C[incoming.id]} kind={incoming.kind} sched={incoming.sched} onAccept={acceptIncoming} onDecline={declineIncoming} />}
    {call && !call.min && <CallScreen call={call} c={call.people && call.people.length ? {...C[call.id], name: call.people.map(p=>first(C[p].name)).join(", "), country: C[call.id].group?C[call.id].name:"Group call"} : C[call.id]} onEnd={endCall}
        onChat={()=>{ setCall(x=>({...x,min:true})); if (open!==call.id) openThread(call.id); }}
        onMin={()=>setCall(x=>({...x,min:true}))} />}
    {call && call.min && <div className="livepill" role="button" tabIndex={0} onClick={()=>setCall(x=>({...x,min:false}))} style={open?{bottom:78}:null}>
      {call.kind==="video"?I.video:I.phone}<span>{first(C[call.id].name)} · <CallClock start={call.start}/></span>
      <button className="mini" aria-label="End call" onClick={e=>{e.stopPropagation(); endCall();}}>{I.endSm}</button>
    </div>}
    {toast && <div key={toast.m} className={"toast"+(toast.out?" out":"")+(toast.act?" hasact":"")} role="status"><span>{toast.m}</span>{toast.act && <button onClick={()=>{ toast.act.fn(); setToast(null); vibe(8); }}>{toast.act.label}</button>}</div>}
  </div>;
}

  const [sel, setSel] = useState(pre);
  const ok = name.trim() && sel.length;
  return <SheetShell label="New group" onClose={onClose}>
      <h3 className="sheettitle">{I.group} New group</h3>
      <input id="gname" className="field" placeholder="Group name" value={name} onChange={e=>setName(e.target.value)} maxLength={40} autoFocus/>
      <div className="sect" style={{padding:0}}>Add members</div>
      <div className="acts">
        {people().map(c=>{ const on = sel.includes(c.id); return <button key={c.id} onClick={()=>setSel(s=>on?s.filter(x=>x!==c.id):[...s,c.id])} aria-pressed={on}>
          <Avatar c={c} noFlag/><span style={{flex:1}}>{c.name}</span><span className={"cbox"+(on?" on":"")}>{on && I.checkbox}</span>

}

/* ---------- sounds (soft, synthesized; off switch in Me) ---------- */
let SOUND = (()=>{ try { return localStorage.getItem("helloo-sound")!=="off"; } catch(e) { return true; } })();
let ACTX = null;
const tone = (f1, f2, dur, vol) => {
  if (!SOUND) return;
  try {
    ACTX = ACTX || new (window.AudioContext||window.webkitAudioContext)();
    const t = ACTX.currentTime, o = ACTX.createOscillator(), g = ACTX.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(ACTX.destination); o.start(t); o.stop(t+dur+0.03);
  } catch(e) {}
};
const sfx = { send: ()=>tone(540, 900, .11, .05), recv: ()=>{ tone(880, 700, .09, .045); setTimeout(()=>tone(1040, 1040, .08, .035), 85); } };

/* ---------- Chats (home) ---------- */
let CHAT_SCROLL = 0;
Object.assign(I, {
  archive: ln(<><rect x="3.5" y="4" width="17" height="4.5" rx="1.5"/><path d="M5 8.5v9A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-9"/><path d="M12 11v5.5M9.5 14l2.5 2.5 2.5-2.5"/></>, 22),
  heart: ln(<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>, 20),
  newchat: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 11.5c0 4.4-3.6 7.5-8 7.5-1.2 0-2.3-.2-3.3-.6L4 19.5l1.2-3.8C4.4 14.5 4 13 4 11.5 4 7.1 7.6 4 12 4"/><path d="M18 3v6M15 6h6"/></svg>,
  pinSm: <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.5 2.8 21.2 9.5l-1.6 1.6-1.2-.4-3.4 3.4.4 4.3-1.5 1.5-4-4L5 20.8 3.2 19l4.9-4.9-4-4L5.6 8.6l4.3.4 3.4-3.4-.4-1.2z"/></svg>,
  imgSm: <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm2.5 4.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM20 16.5l-4.5-4.5L10 17.5l-2.5-2.5L4 18.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2z"/></svg>,
  read: ln(<><path d="M3 12.5 7 16.5 15 8"/><path d="m12 16.5 1 1 8-8.5"/></>, 20),
});

function Chats({threads, unread, typing, getSet, setSet, lists, setLists, onOpen, onCall, onNew, onGroup, onPad, onPayTo, onSendTo, onMarkRead, onDeleteChat, onSettings, onLock, onPage, onNewCommunity, say}){
  const [q, setQ] = useState("");
  const [f, setF] = useState("all");
  const [arch, setArch] = useState(false);
  const [menu, setMenu] = useState(false);
  const [hold, setHold] = useState(null);       // chat id long-pressed
  const [pick, setPick] = useState(null);       // {mode:"pay"} | {mode:"photo", ev}
  const [starred, setStarred] = useState(false);
  const [newList, setNewList] = useState(false);
  const [pressing, setPressing] = useState(null);
  const [scrolled, setScrolled] = useState(CHAT_SCROLL>4);
  const [pull, setPull] = useState(0);        // px pulled
  const [refreshing, setRefreshing] = useState(false);
  const pullSt = useRef(null);
  const onPullDown = e => { const el = listRef.current; if (!el || el.scrollTop > 0 || refreshing || e.pointerType==="mouse" && false) return; pullSt.current = {y:e.clientY, x:e.clientX, on:false, id:e.pointerId}; };
  const onPullMove = e => { const s = pullSt.current; if (!s) return; const dy = e.clientY - s.y, dx = Math.abs(e.clientX - s.x);
    if (!s.on) { if (dx > 10 && dx > dy) { pullSt.current = null; return; } if (dy > 18) { s.on = true; held.current = true; cancel(); } else return; }
    if (dy < 0) { pullSt.current = null; setPull(0); return; }
    const v = Math.min(96, (dy-18)*.55); if (v >= 70 && pull < 70) vibe(8); setPull(v); };
  const onPullUp = () => { const s = pullSt.current; pullSt.current = null; if (!s || !s.on) return;
    setTimeout(()=>{ held.current = false; }, 60);
    if (pull >= 70) { setRefreshing(true); setPull(56); setTimeout(()=>{ setRefreshing(false); setPull(0); say("Up to date"); }, 1100); } else setPull(0); };
  const sw = useRef(null);
  const archiveUndo = id => { setSet(id,{archived:true}); vibe(15); say(`${C[id].name} archived`, {label:"Undo", fn:()=>setSet(id,{archived:false})}); };
  const toggleRead = id => { const u=(unread[id]||0)>0; onMarkRead(id, u?0:1); vibe(10); say(u?"Marked as read":"Marked as unread"); };
  const listRef = useRef(null);
  React.useLayoutEffect(()=>{ if (listRef.current) listRef.current.scrollTop = CHAT_SCROLL; }, []);
  const camIn = useRef(null);
  const holdT = useRef(null), held = useRef(false);

  const all = CONTACTS.filter(c=>!c.broadcast && ((threads[c.id]||[]).length || c.group)).map(c=>({c, last:(threads[c.id]||[]).at(-1), s:getSet(c.id)}));
  const archived = all.filter(x=>x.s.archived);
  const live = all.filter(x=>!x.s.archived);
  const counts = { unread: live.filter(x=>unread[x.c.id]>0).length, groups: live.filter(x=>x.c.group).length, fav: live.filter(x=>x.s.fav).length };
  const pool = arch ? archived : live;
  const list = pool.filter(({c,s})=>{
    if (q && !c.name.toLowerCase().includes(q.toLowerCase()) && !evSummary((threads[c.id]||[]).at(-1)).toLowerCase().includes(q.toLowerCase())) return false;
    if (arch) return true;
    if (f==="unread") return unread[c.id]>0;
    if (f==="fav") return s.fav;
    if (f==="groups") return c.group;
    if (f.startsWith("l:")) return s.lists.includes(f.slice(2));
    return true;
  }).sort((a,b)=>(b.s.pinned-a.s.pinned) || ((b.last?.t||0)-(a.last?.t||0)));
  const chips = [["all","All"],["unread","Unread",counts.unread],["fav","Favorites",counts.fav],["groups","Groups",counts.groups],...lists.map(l=>["l:"+l,l])];

  const down = id => { held.current = false; setPressing(id); clearTimeout(holdT.current); holdT.current = setTimeout(()=>{ held.current = true; vibe(25); setPressing(null); setHold(id); }, 480); };
  const cancel = () => { clearTimeout(holdT.current); setPressing(null); };
  const tap = id => { if (held.current) { held.current = false; return; } onOpen(id); };

  const pickPhoto = ev => {
    const file = ev.target.files && ev.target.files[0]; ev.target.value = "";
    if (!file) return;
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const sc = Math.min(1, 800/Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = img.width*sc; cv.height = img.height*sc;
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      setPick({mode:"photo", ev:{k:"img", src:cv.toDataURL("image/jpeg", .8), name:file.name}});
    }; img.onerror = () => say("That file isn't an image Helloo can show"); img.src = r.result; };
    r.readAsDataURL(file);

/* ---------- Thread pieces ---------- */
const REACTS = ["❤️","😂","👍","😮","🙏","🔥"];
const URL_RE = /(https?:\/\/[^\s]+)/g;
function Wave({seed, progress=0}) {
  const bars = useMemo(()=>Array.from({length:26},(_,i)=>6+Math.abs(Math.sin(seed*7+i*1.7))*18),[seed]);
  return <div className="wave">{bars.map((hh,i)=><i key={i} className={i/bars.length<progress?"done":""} style={{height:hh}}/>)}</div>;
}
function VoiceNote({e}) {
  const [p, setP] = useState(0); const [on, setOn] = useState(false);
  useEffect(()=>{ if(!on) return; const t=setInterval(()=>setP(x=>{ const n=x+0.1/e.dur; if(n>=1){ setOn(false); return 0; } return n; }),100); return ()=>clearInterval(t); },[on]);
  return <div className="voice">
    <button className="play" onClick={ev=>{ ev.stopPropagation(); setOn(x=>!x); }} aria-label={on?"Pause":"Play voice note"}>{on?I.pause:I.play}</button>
    <Wave seed={e.t%97} progress={p}/>
    <span style={{fontFamily:"var(--f-mono)",fontSize:12}}>{fmtDur(on?Math.round(p*e.dur):e.dur)}</span>
  </div>;
}
function Tick({st}) { return st ? <span className={"tick"+(st==="read"?" read":"")} aria-label={st}>{st==="sent"?"✓":"✓✓"}</span> : null; }
const fmtSize = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
const fmtINR = n => "₹"+Number(n).toLocaleString("en-IN");
function Rich({text, hl}) {
  // links become tappable; search matches are highlighted
  return text.split(URL_RE).map((part,i)=>{
    if (URL_RE.test(part)) { URL_RE.lastIndex = 0; return <a key={i} href={part} target="_blank" rel="noopener noreferrer">{part}</a>; }
    if (!hl) return <React.Fragment key={i}>{part}</React.Fragment>;
    const bits = part.split(new RegExp(`(${hl.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"ig"));
    return <React.Fragment key={i}>{bits.map((b,j)=> j%2 ? <mark key={j}>{b}</mark> : b)}</React.Fragment>;
  });
}
function BubbleBody({e, hl}) {
  if (e.k==="voice") return <VoiceNote e={e}/>;
  if (e.k==="img") return <img className="photo" src={e.src} alt={e.name||"Photo"}/>;
  if (e.k==="doc") return <div className="doc"><span className="docic">{I.doc}</span><span style={{minWidth:0}}><b>{e.name}</b><small>{fmtSize(e.size)} · {(e.name.split(".").pop()||"file").toUpperCase()}</small></span></div>;
  if (e.k==="loc") return <div className="loc"><div className="map" aria-hidden="true"><span className="pin">{I.pin}</span></div><b>{e.place}</b><small>Shared location</small></div>;
  if (e.k==="card") { const x=C[e.cid]; return <div className="ccard"><Avatar c={x} noFlag/><span style={{minWidth:0}}><b>{x.name}</b><small>{x.flag} {x.country} · {x.phone}</small></span></div>; }
  if (e.k==="pay") return <div className="paycard"><small>{I.coin} Gloobal Pay</small><b>{fmtINR(e.amt)}</b><span>{e.from==="me"?"Sent":"Received"}{e.note?` · ${e.note}`:""}</span><em>✓ Completed · ₹0 fee</em></div>;
  if (e.k==="payreq") return <div className="payreq">
    <div className="qrwrap"><QR text={PAY_LINK}/><span className="qrtag">{ME.name.toLowerCase()}.gloobal</span></div>
    <div className="preqtext"><b>Pay {ME.name} on GLOOBAL{e.amt?`: ${fmtINR(e.amt)}`:""}</b>{e.note && <span>{e.note}</span>}<a href={PAY_LINK} target="_blank" rel="noopener noreferrer" onClick={ev=>ev.stopPropagation()}>{PAY_LINK}</a></div>
    <span className={"preqstate"+(e.paid?" paid":"")}>{e.paid ? "✓ Paid" : "Waiting for payment"}</span>
  </div>;
  if (e.k==="calllink") { const url = `https://gloobalv3.netlify.app/call/${e.code}`; return <div className="callcard">
    <span className="callcardic">{e.kind==="video"?I.video:I.phone}</span>
    <div style={{minWidth:0}}><b>Join {e.kind} call</b><a href={url} target="_blank" rel="noopener noreferrer" onClick={ev=>ev.stopPropagation()}>{url}</a></div>
    <button className="joinbtn" data-join={e.kind}>Join</button></div>; }
  if (e.k==="sched") { const past = e.at <= Date.now(); return <div className="callcard">
    <span className="callcardic">{I.calendar}</span>
    <div style={{minWidth:0}}><b>{e.title}</b><span>{new Date(e.at).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"})} · {fmtTime(e.at)} · {e.kind}</span><span className="sched">{past ? "Started" : `Starts ${until(e.at)}`}</span></div>
    <button className="joinbtn" data-join={e.kind}>{past?"Join":"Start now"}</button></div>; }
  return <Rich text={e.text} hl={hl}/>;
}
const evSummary = e => !e ? "" : e.k==="msg" ? e.text : e.k==="voice" ? `🎤 Voice note ${fmtDur(e.dur)}` : e.k==="img" ? "📷 Photo" : e.k==="doc" ? `📄 ${e.name}` : e.k==="loc" ? `📍 ${e.place}` : e.k==="card" ? `👤 ${C[e.cid]?.name}` : e.k==="pay" ? `${fmtINR(e.amt)} via Gloobal Pay` : e.k==="payreq" ? `Payment request${e.amt?` · ${fmtINR(e.amt)}`:""}` : e.k==="sys" ? e.text : e.k==="calllink" ? `🔗 ${e.kind==="video"?"Video":"Voice"} call link` : e.k==="sched" ? `📅 ${e.title}` : "";

function Bubble({e, group, hl, onHold, onDouble, onReply}) {
  const ref = useRef(null), st = useRef(null), last = useRef(0), holdT = useRef(null);
  const [burst, setBurst] = useState(false);
  const hold = () => { const b = ref.current && ref.current.querySelector(".b"); if (b) { vibe(20); onHold(b.getBoundingClientRect()); } };
  const down = ev => {
    if (ev.target.closest("a,button")) return;
    st.current = {x:ev.clientX, y:ev.clientY, dx:0, moved:false, held:false};
    clearTimeout(holdT.current); holdT.current = setTimeout(()=>{ if (st.current && !st.current.moved) { st.current.held = true; hold(); } }, 430);
  };
  const move = ev => {
    const s = st.current; if (!s) return;
    const dx = ev.clientX - s.x, dy = Math.abs(ev.clientY - s.y);
    if (dy > 14 && !s.moved) { clearTimeout(holdT.current); st.current = null; return; }
    if (Math.abs(dx) > 6) { s.moved = true; clearTimeout(holdT.current); }
    s.dx = Math.max(0, Math.min(80, dx));
    if (ref.current) { ref.current.style.transform = `translateX(${s.dx}px)`; ref.current.dataset.swipe = s.dx>56 ? "go" : ""; }
  };
  const up = () => {
    clearTimeout(holdT.current);
    const s = st.current; st.current = null;
    if (ref.current) { ref.current.style.transform = ""; ref.current.dataset.swipe = ""; }
    if (!s || s.held) return;
    if (s.dx > 56) { vibe(12); onReply(); return; }
    if (!s.moved) {
      const now = Date.now();
      if (now - last.current < 300) { last.current = 0; vibe(14); setBurst(true); setTimeout(()=>setBurst(false), 750); onDouble(); }
      else last.current = now;
    }
  };
  const by = group && e.from==="them" && e.by ? C[e.by] : null;
  return <div className={"bwrap "+e.from} ref={ref} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={()=>{ clearTimeout(holdT.current); st.current=null; if(ref.current) ref.current.style.transform=""; }} onContextMenu={ev=>{ ev.preventDefault(); hold(); }}>
    <span className="swipeic" aria-hidden="true">{I.reply}</span>
    <div className={"b "+e.from+(e.k==="img"?" media":"")+(e.k==="pay"?" pay":"")+(e.k==="payreq"||e.k==="calllink"||e.k==="sched"?" preq":"")} role="button" tabIndex={0} aria-label="Message. Press Enter for options" onKeyDown={ev=>ev.key==="Enter"&&hold()}>
      {by && <span className="byname" style={{color:`hsl(${by.hue} 65% 45%)`}}>{by.name}</span>}
      {e.fwd && <span className="fwdtag">{I.forward} Forwarded</span>}
      {e.bc && <span className="fwdtag">{I.broadcast} Broadcast</span>}
      {e.reply && <span className="quote"><b>{e.reply.from==="me"?"You":e.reply.name}</b>{e.reply.text}</span>}
      <BubbleBody e={e} hl={hl}/>
      <span className="meta">{e.exp && <span className="ricon" aria-label="Disappearing">{I.timer}</span>}{e.star && <span aria-label="Starred">★</span>}{fmtTime(e.t)}{e.from==="me" && <Tick st={e.st}/>}</span>
    </div>
    {e.react && <span className="react" key={e.react}>{e.react}</span>}
    {burst && <span className="burst" aria-hidden="true">❤️</span>}
  </div>;
}

function SheetShell({label, cls="msgsheet", onClose, children}) {
  const [out, setOut] = useState(false);
  const ref = useRef(null), drag = useRef(null);
  const close = () => { if (out) return; setOut(true); setTimeout(onClose, 190); };
  const down = e => {
    const r = ref.current; if (!r || e.target.closest("input,textarea,select")) return;
    if (e.clientY - r.getBoundingClientRect().top > 64) return;     // drag only from the top of the sheet
    drag.current = {y:e.clientY, dy:0, id:e.pointerId};
  };
  const move = e => {
    const d = drag.current; if (!d) return;
    d.dy = Math.max(0, e.clientY - d.y);
    if (d.dy > 4) { try { ref.current.setPointerCapture(d.id); } catch(x){} ref.current.style.transition = "none"; ref.current.style.transform = `translateY(${d.dy}px)`; }
  };
  const up = () => {
    const d = drag.current; drag.current = null; if (!d) return;
    const r = ref.current; r.style.transition = "transform .2s cubic-bezier(.2,.8,.2,1)";
    if (d.dy > 110) { r.style.transform = "translateY(100%)"; setOut(true); setTimeout(onClose, 180); } else r.style.transform = "";
  };
  return <>
    <div className={"backdrop"+(out?" out":"")} onClick={close}/>
    <div ref={ref} className={"sheet pad "+cls+(out?" out":"")} role="dialog" aria-label={label} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
      <span className="grab"/>
      {children}
    </div>
  </>;
}
function Sheet({title, icon, onClose, children}) {
  return <SheetShell label={title||"Options"} onClose={onClose}>
    {title && <h3 className="sheettitle">{icon}{title}</h3>}
    {children}
  </SheetShell>;
}

/* ---------- Thread ---------- */
function Thread({onCallPeople, onSchedule, initView, cls, c, events, typing, set, onSet, lists, setLists, onBack, onPost, onSys, onPatch, onDelete, onClear, onForward, onCall, onExport, onNewGroup, say}){
  const [text, setText] = useState("");
  const [rec, setRec] = useState(null);
  const [sel, setSel] = useState(null);
  const [fwdPick, setFwdPick] = useState(false);
  const [reply, setReply] = useState(null);
  const [panel, setPanel] = useState(null);   // attach | emoji
  const [menu, setMenu] = useState(0);        // 0 closed, 1 main, 2 more
  const [view, setView] = useState(initView==="payreq" ? "pay" : (initView||null));     // profile | media | theme | mute | disappear | lists | clear | block | report | pay
  const [payMode, setPayMode] = useState(initView==="payreq" ? "request" : "send");
  const [callMenu, setCallMenu] = useState(false);
  const ovRef = useRef(null);
  const ovEdge = useEdgeBack(ovRef, ()=>setView(null));
  const [focus, setFocus] = useState(null);      // {i, rect, out}
  const [away, setAway] = useState(false);
  const [fresh, setFresh] = useState(0);
  const awayRef = useRef(false); awayRef.current = away;
  const closeFocus = () => { setFocus(f=>f&&{...f,out:true}); setTimeout(()=>setFocus(null), 170); };
  const [search, setSearch] = useState(null); // null = off, string = query
  const [hit, setHit] = useState(0);
  const [, tick] = useState(0);
  const end = useRef(null), feed = useRef(null), inputRef = useRef(null), photoIn = useRef(null), camIn = useRef(null), docIn = useRef(null);
  const root = useRef(null), edge = useRef(null);
  const isMuted = set.mute > Date.now();
  const firstScroll = useRef(true);
  React.useLayoutEffect(()=>{ if (feed.current) feed.current.scrollTop = feed.current.scrollHeight; }, []);
  useEffect(()=>{
    if (firstScroll.current) { firstScroll.current = false; return; }
    const lastEv = events.at(-1);
    if (awayRef.current && lastEv && lastEv.from!=="me") { setFresh(n=>n+1); return; }
    if (search===null) end.current?.scrollIntoView({behavior:"smooth", block:"end"});
  }, [events.length, typing]);
  const toLatest = () => { setFresh(0); end.current?.scrollIntoView({behavior:"smooth", block:"end"}); };
  useEffect(()=>{
    const vv = window.visualViewport; if (!vv) return;
    let lastH = vv.height;
    const onR = () => { if (vv.height < lastH - 80 && !awayRef.current) end.current?.scrollIntoView({block:"end"}); lastH = vv.height; };
    vv.addEventListener("resize", onR); return ()=>vv.removeEventListener("resize", onR);
  }, []);
  useEffect(()=>{ if(!rec) return; const t=setInterval(()=>tick(x=>x+1),250); return ()=>clearInterval(t); },[rec]);

  // search
  const matches = useMemo(()=> search ? events.map((e,i)=>[e,i]).filter(([e])=>evSummary(e).toLowerCase().includes(search.toLowerCase())).map(([,i])=>i) : [], [search, events]);
  useEffect(()=>{ setHit(matches.length ? matches.length-1 : 0); }, [search]);
  useEffect(()=>{
    if (!matches.length) return;
    const el = feed.current?.querySelector(`[data-idx="${matches[hit]}"]`);
    if (el) { el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }, [hit, matches.length]);

  const post = ev => { onPost(reply ? {...ev, reply} : ev); setReply(null); setPanel(null); vibe(6); };
  const startReply = e => { setSel(null); setReply({from:e.from, name:e.by?first(C[e.by].name):first(c.name), text:evSummary(e).slice(0,80)}); setTimeout(()=>inputRef.current?.focus(), 50); };
  const submit = e => {
    e.preventDefault();
    if (rec) { const s = Math.max(1, Math.round((Date.now()-rec)/1000)); setRec(null); return post({k:"voice", dur:s}); }
    const t = text.trim();
    if (!t) { vibe(15); setPanel(null); return setRec(Date.now()); }
    post({k:"msg", text:t}); setText("");
  };
  const pickFile = (ev, kind) => {
    const f = ev.target.files && ev.target.files[0]; ev.target.value = "";
    if (!f) return;
    if (kind==="doc") return post({k:"doc", name:f.name, size:f.size});
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 800/Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = img.width*sc; cv.height = img.height*sc;
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        post({k:"img", src:cv.toDataURL("image/jpeg", .8), name:f.name});
      };
      img.onerror = () => say("That file isn't an image Helloo can show");
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  const shareable = people().find(x=>x.id!==c.id && !(c.members||[]).includes(x.id)) || people().find(x=>x.id!==c.id);
  const ATTACH = [
    {k:"photo", l:"Gallery", ic:I.image, col:"#7C4DFF", go:()=>photoIn.current.click()},
    {k:"cam", l:"Camera", ic:I.camera, col:"#E1297C", go:()=>camIn.current.click()},
    {k:"doc", l:"Document", ic:I.doc, col:"#1D6FE0", go:()=>docIn.current.click()},
    {k:"loc", l:"Location", ic:I.pin, col:"#06A06B", go:()=>post({k:"loc", place:"Bengaluru, India"})},
    {k:"card", l:"Contact", ic:I.idcard, col:"#E8641B", go:()=>shareable && post({k:"card", cid:shareable.id})},
    {k:"req", l:"Pay link", ic:I.qr, col:"#0E9F62", go:()=>{ setPanel(null); setPayMode("request"); setView("pay"); }},
  ];

  const edgeDown = ev => { if (ev.clientX - root.current.getBoundingClientRect().left < 26) edge.current = {x:ev.clientX, dx:0}; };
  const edgeMove = ev => { if (!edge.current) return; edge.current.dx = Math.max(0, ev.clientX-edge.current.x); root.current.style.transform = `translateX(${edge.current.dx}px)`; };
  const edgeUp = () => { if (!edge.current) return; const dx = edge.current.dx; edge.current = null; root.current.style.transition = "transform .2s"; root.current.style.transform = ""; setTimeout(()=>{ if(root.current) root.current.style.transition=""; }, 220); if (dx > 90) onBack(); };

  const go = v => { setMenu(0); setView(v); vibe(6); };
  const MENU1 = [
    ["New group", I.group, ()=>{ setMenu(0); onNewGroup(); }],
    [c.group?"Group info":"View contact", I.user, ()=>go("profile")],
    ["Search", I.search, ()=>{ setMenu(0); setSearch(""); }],
    ["Media, links, and docs", I.media, ()=>go("media")],
    [isMuted?"Unmute notifications":"Mute notifications", isMuted?I.bell:I.bellOff, ()=>{ if (isMuted) { setMenu(0); onSet({mute:0}); say("Notifications on"); } else go("mute"); }],
    ["Disappearing messages", I.timer, ()=>go("disappear")],
    ["Chat theme", I.wall, ()=>go("theme")],
  ];
  const MENU2 = [
    ["Report", I.report, ()=>go("report"), true],
    [set.blocked?"Unblock":"Block", I.block, ()=>go("block"), !set.blocked],
    ["Clear chat", I.clear, ()=>go("clear")],
    ["Export chat", I.export, ()=>{ setMenu(0); onExport(); }],
    [set.pinned?"Remove shortcut":"Add shortcut", I.shortcut, ()=>{ setMenu(0); onSet({pinned:!set.pinned}); say(set.pinned?"Shortcut removed":"Shortcut added · pinned to the top of Helloo"); }],
    ["Add to list", I.list, ()=>go("lists")],
  ];

  const media = useMemo(()=>({
    img: events.filter(e=>e.k==="img"),
    doc: events.filter(e=>e.k==="doc"),
    link: events.flatMap(e=> e.k==="msg" ? (e.text.match(URL_RE)||[]).map(u=>({u, e})) : e.k==="payreq" ? [{u:PAY_LINK, e}] : []),
    pay: events.filter(e=>e.k==="pay"||e.k==="payreq"),
  }), [events]);
  const [mtab, setMtab] = useState("img");

  const selEv = sel!==null ? events[sel] : null;
  const closeSel = () => { setSel(null); setFwdPick(false); };
  const close = () => setView(null);
  const subtitle = typing ? (typing===true ? "typing…" : `${typing} is typing…`) : c.group ? c.members.map(m=>first(C[m].name)).concat("You").join(", ") : c.online ? "Online" : `${c.flag} ${c.country}`;
  let lastDay = null;

  return <div className={"screen "+cls} ref={root} onPointerDown={edgeDown} onPointerMove={edgeMove} onPointerUp={edgeUp} onPointerCancel={edgeUp}>
    {search===null
      ? <header className="thead pad">
          <button className="iconbtn" onClick={onBack} aria-label="Back">{I.back}</button>
          <button onClick={()=>setView("profile")} style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
            <Avatar c={c} vtn={"av-"+c.id}/>
            <span className="who"><b>{c.name}{isMuted && <span className="ricon" style={{marginLeft:4}}>{I.bellOff}</span>}</b><small style={typing?{color:"var(--purple)"}:(c.online&&!c.group)?null:{color:"var(--muted)"}}>{subtitle}</small></span>
          </button>
          {!c.broadcast && <button className="callpick" onClick={()=>{ vibe(6); setCallMenu(x=>!x); setMenu(0); }} aria-label="Call options" aria-expanded={callMenu}>{I.video}{I.caret}</button>}
          <button className="iconbtn" onClick={()=>{ vibe(6); setCallMenu(false); setMenu(m=>m?0:1); }} aria-label="More options" aria-expanded={!!menu}>{I.more}</button>
        </header>
      : <header className="thead pad">
          <button className="iconbtn" onClick={()=>setSearch(null)} aria-label="Close search">{I.back}</button>
          <input id="tsearch" className="field" style={{flex:1}} autoFocus placeholder="Search this chat" value={search} onChange={e=>setSearch(e.target.value)}/>
          <span className="rtime" style={{minWidth:40,textAlign:"center"}}>{search ? (matches.length ? `${hit+1}/${matches.length}` : "0") : ""}</span>
          <button className="iconbtn" disabled={!matches.length} onClick={()=>setHit(h=>(h-1+matches.length)%matches.length)} aria-label="Previous match">{I.up}</button>
          <button className="iconbtn" disabled={!matches.length} onClick={()=>setHit(h=>(h+1)%matches.length)} aria-label="Next match">{I.down}</button>
        </header>}

    {callMenu && <>
      <div className="menuveil" onClick={e=>veilClose(e,()=>setCallMenu(false))}/>
      <div className="menu callmenu" role="menu">
        <button role="menuitem" onClick={()=>{ setCallMenu(false); onCall("voice"); }}>{I.phone}<span>Voice call</span></button>
        <button role="menuitem" onClick={()=>{ setCallMenu(false); onCall("video"); }} style={{animationDelay:"18ms"}}>{I.video}<span>Video call</span></button>
        <div className="menusep"/>
        <button role="menuitem" onClick={()=>{ setCallMenu(false); setView("people"); }} style={{animationDelay:"36ms"}}>{I.selectPeople}<span>Select people</span></button>
        <button role="menuitem" onClick={()=>{ setCallMenu(false); post({k:"calllink", kind:"video", code:callCode()}); say("Call link sent"); }} style={{animationDelay:"54ms"}}>{I.link}<span>Send call link</span></button>
        <button role="menuitem" onClick={()=>{ setCallMenu(false); setView("schedule"); }} style={{animationDelay:"72ms"}}>{I.calendar}<span>Schedule call</span></button>
      </div>
    </>}
    {menu>0 && <>
      <div className="menuveil" onClick={e=>veilClose(e,()=>setMenu(0))}/>
      <div className="menu" role="menu" key={menu}>
        {(menu===1?MENU1:MENU2).map(([l,ic,fn,danger],i)=><button key={l} role="menuitem" className={danger?"danger":""} onClick={fn} style={{animationDelay:`${i*18}ms`}}>{ic}<span>{l}</span></button>)}
        {menu===1 ? <button role="menuitem" className="moreitem" onClick={()=>setMenu(2)}><span>More</span>{I.chev}</button>
                  : <button role="menuitem" className="moreitem" onClick={()=>setMenu(1)}>{I.back}<span>Back</span></button>}
      </div>
    </>}

    <div className="scroll pad" ref={feed} style={{background:wallCss(set.wall||DEFAULT_WALL)}} onScroll={e=>{ const el=e.currentTarget; const far = el.scrollHeight-el.clientHeight-el.scrollTop > 260; if (far!==awayRef.current) { setAway(far); if (!far) setFresh(0); } }} onClick={ev=>{ const j = ev.target.closest("[data-join]"); if (j) { ev.stopPropagation(); onCall(j.dataset.join); return; } panel&&setPanel(null); }}>
      <div className="feed">
        <div className="e2e"><span>{I.lock} {c.broadcast?"Broadcast list · replies arrive in each person's chat":c.ann?"Announcements":c.group?"Group chat":"Verified on Gloobal"} · end-to-end encrypted</span>{set.disappear>0 && <span style={{color:"var(--purple)"}}>{I.timer} Messages disappear after {disLabel(set.disappear)}</span>}</div>
        {events.map((e,i)=>{
          const lbl = dayLabel(e.t); const sep = lbl!==lastDay; lastDay = lbl;
          return <React.Fragment key={e.t+"-"+i}>
            {sep && <div className="daysep">{lbl}</div>}
            <div data-idx={i} className={"evrow "+(e.k==="call"||e.k==="sys"?"c":e.from)}>
            {e.k==="sys" ? <div className="sysmsg">{e.text}</div>
            : e.k==="call"
              ? <button className={"callev"+(e.dir==="missed"?" missed":"")} onClick={()=>setSel(i)}>
                  {e.kind==="video"?I.video:I.phone}
                  <span className="cevtext"><b>{e.dir==="missed" ? `Missed ${e.kind} call` : `${e.kind==="video"?"Video":"Voice"} call`}</b><small>{e.dir==="missed" ? fmtTime(e.t) : `${fmtDur(e.dur)} · ${fmtTime(e.t)}`}</small></span>
                  <span className="again" role="button" onClick={ev=>{ ev.stopPropagation(); onCall(e.kind); }}>Call back</span>
                </button>
              : <Bubble e={e} group={c.group} hl={search||null} onHold={rect=>setFocus({i, rect})} onDouble={()=>onPatch(i,{react: e.react==="❤️"?null:"❤️"})} onReply={()=>startReply(e)}/>}
            </div>
          </React.Fragment>;
        })}
        {events.length===0 && <div className="empty" style={{paddingBlock:20}}>No messages here yet. Say Helloo 👋</div>}
        {typing && <div className="typing" aria-label="typing"><i/><i/><i/></div>}
        <div ref={end}/>
      </div>
    </div>

    {set.blocked
      ? <div className="blockedbar pad"><span>You blocked {c.name}.</span><button className="primary" style={{width:"auto",paddingInline:18}} onClick={()=>{ onSet({blocked:false}); onSys(`You unblocked ${c.name}`); say("Unblocked"); }}>Unblock</button></div>
      : <>
        {panel==="attach" && <div className="attach pad" role="menu">
          {ATTACH.map((a,i)=><button key={a.k} role="menuitem" style={{animationDelay:`${i*30}ms`}} onClick={a.go}><span style={{background:a.col}}>{a.ic}</span>{a.l}</button>)}
        </div>}
        {panel==="emoji" && <div className="emojis pad" role="menu">
          {EMOJIS.map((em,i)=><button key={i} onClick={()=>{ vibe(4); setText(t=>t+em); }} aria-label={`Insert ${em}`}>{em}</button>)}
        </div>}
        {reply && <div className="replybar pad"><span className="quote" style={{flex:1,margin:0}}><b>Replying to {reply.from==="me"?"you":reply.name}</b>{reply.text}</span><button className="iconbtn" onClick={()=>setReply(null)} aria-label="Cancel reply">{I.close}</button></div>}
        <form className="composer pad" onSubmit={submit}>
          {rec
            ? <div className="recbar"><i/>Recording {fmtDur(Math.floor((Date.now()-rec)/1000))}<button type="button" onClick={()=>setRec(null)} style={{marginLeft:"auto",color:"var(--muted)",fontFamily:"var(--f-body)",fontSize:13}}>Cancel</button></div>
            : <div className="inputpill">
                <button type="button" className={"pillbtn"+(panel==="emoji"?" on":"")} onClick={()=>setPanel(p=>p==="emoji"?null:"emoji")} aria-label="Emoji">{I.emoji}</button>
                <input id="msg" ref={inputRef} value={text} onChange={e=>setText(e.target.value)} onFocus={()=>setPanel(p=>p==="emoji"?p:null)} placeholder="Message" autoComplete="off"/>
                <button type="button" className={"pillbtn"+(panel==="attach"?" on":"")} onClick={()=>{ vibe(6); setPanel(p=>p==="attach"?null:"attach"); }} aria-label="Attach">{I.clip}</button>
                {!text && <button type="button" className="pillbtn" onClick={()=>{ setPanel(null); setPayMode("send"); setView("pay"); }} aria-label="Gloobal Pay">{I.rupee}</button>}
                {!text && <button type="button" className="pillbtn" onClick={()=>camIn.current.click()} aria-label="Camera">{I.cameraSm}</button>}
              </div>}
          <button className={"send"+(rec?" rec":"")} aria-label={rec?"Send voice note":text.trim()?"Send":"Record voice note"}>{rec||text.trim() ? I.send : I.mic}</button>
        </form>
      </>}
    <input ref={photoIn} type="file" accept="image/*" hidden onChange={e=>pickFile(e,"img")}/>
    <input ref={camIn} type="file" accept="image/*" capture="environment" hidden onChange={e=>pickFile(e,"img")}/>
    <input ref={docIn} type="file" hidden onChange={e=>pickFile(e,"doc")}/>

    {away && !focus && <button className={"tolatest"+(set.blocked?" low":"")} onClick={toLatest} aria-label="Jump to latest message">{I.down}{fresh>0 && <i className="badge">{fresh}</i>}</button>}

    {/* long-press: the message lifts out with reactions and actions */}
    {focus && events[focus.i] && (()=>{
      const fe = events[focus.i], me = fe.from==="me";
      const box = root.current ? root.current.getBoundingClientRect() : {top:0, height:window.innerHeight};
      const bh = Math.min(focus.rect.height, box.height*.36);
      const need = 64 + bh + 12 + (fe.k==="msg"?5:4)*50 + 16;
      const top = Math.max(64, Math.min(focus.rect.top - box.top - 64, box.height - need - 12));
      const act = fn => { closeFocus(); setTimeout(fn, 120); };
      return <>
        <div className={"focusveil"+(focus.out?" out":"")} onClick={closeFocus}/>
        <div className={"focus "+(me?"me":"them")+(focus.out?" out":"")} style={{top}} role="dialog" aria-label="Message options">
          <div className="reacts focusreacts">{REACTS.map((r,j)=><button key={r} style={{animationDelay:`${j*25}ms`}} className={fe.react===r?"on":""} onClick={()=>{ vibe(10); onPatch(focus.i,{react: fe.react===r?null:r}); closeFocus(); }} aria-label={`React ${r}`}>{r}</button>)}</div>
          <div className={"b "+fe.from+" focusb"+(fe.k==="img"?" media":"")+(fe.k==="pay"?" pay":"")+(fe.k==="payreq"||fe.k==="calllink"||fe.k==="sched"?" preq":"")} style={{maxHeight:bh+2}}>
            <BubbleBody e={fe}/>
            <span className="meta">{fmtTime(fe.t)}{me && <Tick st={fe.st}/>}</span>
          </div>
          <div className="focusacts">
            <button onClick={()=>act(()=>startReply(fe))}>{I.reply}<span>Reply</span></button>
            {fe.k==="msg" && <button onClick={()=>act(()=>{ try { navigator.clipboard.writeText(fe.text).then(()=>say("Copied"), ()=>say("Copy isn't allowed here")); } catch(err){ say("Copy isn't allowed here"); } })}>{I.copy}<span>Copy</span></button>}
            <button onClick={()=>act(()=>{ setSel(focus.i); setFwdPick(true); })}>{I.forward}<span>Forward</span></button>
            <button onClick={()=>act(()=>{ onPatch(focus.i,{star:!fe.star}); say(fe.star?"Unstarred":"Starred"); })}>{I.star}<span>{fe.star?"Unstar":"Star"}</span></button>
            <button className="danger" onClick={()=>act(()=>{ const i=focus.i; onDelete(i); say("Message deleted"); })}>{I.trash}<span>Delete</span></button>
          </div>
        </div>
      </>;
    })()}

    {/* message options */}
    {selEv && <Sheet onClose={closeSel}>
      {selEv.k==="call" ? <>
        <div className="selprev">{selEv.kind==="video"?I.video:I.phone}<span>{callLabel(selEv)} · {dayLabel(selEv.t)} {fmtTime(selEv.t)}</span></div>
        <div className="acts">
          <button onClick={()=>{ closeSel(); onCall("voice"); }}>{I.phone}Voice call</button>
          <button onClick={()=>{ closeSel(); onCall("video"); }}>{I.video}Video call</button>
          <button className="danger" onClick={()=>{ onDelete(sel); closeSel(); say("Removed from call history"); }}>{I.trash}Remove from history</button>
        </div>
      </> : fwdPick ? <>
        <div className="selprev"><span>Forward to…</span></div>
        <div className="acts">{CONTACTS.filter(x=>x.id!==c.id).map(x=><button key={x.id} onClick={()=>{ onForward(selEv, x.id); closeSel(); }}><Avatar c={x} noFlag/>{x.name}</button>)}</div>
      </> : <>
        <div className={"selprev "+selEv.from}><span>{evSummary(selEv)}</span></div>
        <div className="reacts">{REACTS.map(r=><button key={r} className={selEv.react===r?"on":""} onClick={()=>{ vibe(10); onPatch(sel,{react: selEv.react===r?null:r}); closeSel(); }} aria-label={`React ${r}`}>{r}</button>)}</div>
        <div className="acts">
          <button onClick={()=>startReply(selEv)}>{I.reply}Reply</button>
          {selEv.k==="msg" && <button onClick={()=>{ const t=selEv.text; try { navigator.clipboard.writeText(t).then(()=>say("Copied"), ()=>say("Copy isn't allowed here")); } catch(err){ say("Copy isn't allowed here"); } closeSel(); }}>{I.copy}Copy text</button>}
          <button onClick={()=>setFwdPick(true)}>{I.forward}Forward</button>
          <button onClick={()=>{ onPatch(sel,{star:!selEv.star}); say(selEv.star?"Unstarred":"Starred"); closeSel(); }}>{I.star}{selEv.star?"Unstar":"Star"}</button>
          <button className="danger" onClick={()=>{ onDelete(sel); closeSel(); say("Message deleted"); }}>{I.trash}Delete for me</button>
        </div>
      </>}
    </Sheet>}

    {/* profile / group info */}
    {view==="profile" && <div className="screen fwd overlay" ref={el=>{ ovRef.current = el; }} {...ovEdge}>
      <header className="thead pad" style={{borderBottom:0,background:"transparent"}}>
        <button className="iconbtn" onClick={e=>closeWith(e,close)} aria-label="Back">{I.back}</button><b style={{flex:1}}>{c.group?"Group info":"Contact info"}</b>
      </header>
      <div className="scroll pad">
        <div className="prof">
          <Avatar c={c} size="lg"/>
          <h2>{c.name}</h2>

/* ---------- Dial: the Gloobal symbol pad ---------- */
function Dial({onCall, onOpen, say}){
  const [val, setVal] = useState([]);
  const matches = val.length ? people().filter(c=>startsWith(c.sec, val)) : [];
  const exact = val.length===ID_LEN ? matches[0] : (matches.length===1 && val.length>=3 ? matches[0] : null);
  const add = s => setVal(v => v.length<ID_LEN ? [...v,s] : v);
  const fill = c => { setVal([]); c.sec.forEach((s,i)=>setTimeout(()=>setVal(v=>[...v,s]), 45*(i+1))); };
  const go = kind => exact ? onCall(exact.id, kind) : say(val.length===ID_LEN ? "No Gloobal member with this ID" : "Keep dialling the 12 symbols");
  return <>
    <header className="top pad"><h1>Pad</h1><span style={{fontSize:12,fontWeight:700,color:"var(--ok)"}}>Dial any Gloobal ID · free</span></header>
    <div className="scroll pad" style={{display:"flex",flexDirection:"column"}}>
      <div className="idbar"><Slots val={val}/></div>
      <div className="matches" aria-live="polite">
        {val.length===0 && people().slice(0,4).map(c=><button key={c.id} className="match" onClick={()=>fill(c)}><Avatar c={c} noFlag/>{c.name.split(" ")[0]}</button>)}
        {val.length>0 && matches.map(c=><button key={c.id} className={"match"+(exact&&exact.id===c.id?" full":"")} onClick={()=>fill(c)}><Avatar c={c} noFlag/>{c.name}<span style={{color:"var(--muted)",fontWeight:600}}>{c.flag}</span></button>)}
        {val.length>0 && matches.length===0 && <span style={{color:"var(--muted)",fontWeight:600,fontSize:13,alignSelf:"center"}}>No member starts with these symbols</span>}
      </div>
      <SymbolPad order={PAD_ORDER} onSym={add} onDel={()=>setVal(v=>v.slice(0,-1))} onClear={()=>setVal([])} size="min(58vw, 236px, 32vh)"/>
      <div className="dialacts">
        <button className="iconbtn soft" style={{width:54,height:54}} disabled={!exact} onClick={()=>exact&&onOpen(exact.id)} aria-label="Message">{I.chatSm}</button>
        <button className="bigcall" disabled={!exact} onClick={()=>go("voice")} aria-label="Voice call">{I.phoneL}</button>
        <button className="iconbtn soft" style={{width:54,height:54}} disabled={!exact} onClick={()=>go("video")} aria-label="Video call">{I.video}</button>
      </div>
      <p style={{textAlign:"center",color:"var(--muted)",fontSize:12,fontWeight:600,margin:"0 0 16px"}}>{exact ? `${exact.flag} ${exact.name} · ${exact.country}` : "Tap a name to fill their ID, or dial symbols. Hold × to clear."}</p>
    </div>
  </>;
}

function Switch({on, onChange, disabled}) {
  const ref = useRef(null), d = useRef(null);
  const down = e => { if (disabled) return; e.stopPropagation(); d.current = {x:e.clientX, moved:false, id:e.pointerId}; try { ref.current.setPointerCapture(e.pointerId); } catch(x){} };
  const move = e => { const s = d.current; if (!s) return; const dx = e.clientX - s.x; if (Math.abs(dx) > 3) s.moved = true;
    const k = ref.current.firstChild; const base = on ? 18 : 0; k.style.transition = "none"; k.style.transform = `translateX(${Math.max(0, Math.min(18, base + dx))}px)`; };
  const up = e => { const s = d.current; d.current = null; if (!s) return; const k = ref.current.firstChild; k.style.transition = ""; k.style.transform = "";
    e.stopPropagation(); const dx = e.clientX - s.x; const next = s.moved ? (dx > 6 ? true : dx < -6 ? false : on) : !on; if (next !== on) { vibe(6); onChange(next); } };
  return <span ref={ref} className={"switch"+(on?" on":"")} role="switch" aria-checked={on} tabIndex={0} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onKeyDown={e=>{ if (e.key===" "||e.key==="Enter") { e.preventDefault(); onChange(!on); } }}><i/></span>;
}
function Toggle({label, sub, on, onChange, disabled}) {
  return <div className="listbtn" style={disabled?{opacity:.45}:null} onClick={e=>{ if (!disabled && !e.target.closest(".switch")) { vibe(6); onChange(!on); } }}>
    <span style={{flex:1,minWidth:0}}>{label}{sub && <small className="lsub">{sub}</small>}</span>
    <Switch on={on} onChange={onChange} disabled={disabled}/>
  </div>;
}
function Choice({label, value, onChange, options}) {
  return <div className="listbtn" style={{flexDirection:"column",alignItems:"stretch",gap:10,cursor:"default"}}>
    <span>{label}</span>
    <div className="seg">{options.map(([k,l])=><button key={k} className={value===k?"on":""} onClick={()=>{ vibe(4); onChange(k); }}>{l}</button>)}</div>
  </div>;
}

function ProfileEdit({p, set, onBack, say}) {
  const orig = useRef({name:p.name, about:p.about, hue:p.hue, photo:p.photo});
  const [name, setName] = useState(p.name);
  const [about, setAbout] = useState(p.about);
  const [hue, setHue] = useState(p.hue);
  const [photo, setPhoto] = useState(p.photo);
  const saved = useRef(false);
  useEffect(()=>{ set({hue, photo}); }, [hue, photo]);                       // live preview on the Me card
  useEffect(()=>()=>{ if (!saved.current) set(orig.current); }, []);       // leaving without Save reverts
  const fileIn = useRef(null);
  const o = orig.current; const dirty = name.trim()!==o.name || about!==o.about || hue!==o.hue || photo!==o.photo;
  const pick = ev => {
    const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(img.width, img.height), cv = document.createElement("canvas"); cv.width = cv.height = 256;
      cv.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 256, 256);
      setPhoto(cv.toDataURL("image/jpeg", .85)); vibe(8);
    }; img.onerror = ()=>say("That file isn't an image Helloo can show"); img.src = r.result; };
    r.readAsDataURL(f);
  };
  const save = () => { if (!name.trim()) return say("Add a name"); saved.current = true; set({name:name.trim(), about, hue, photo}); ME.name = name.trim(); vibe(15); say("Profile saved"); onBack(); };
  const preview = {name, about, hue, photo};
  return <SubPage title="Edit profile" onBack={onBack} action={<button className="textbtn" disabled={!dirty} style={dirty?null:{opacity:.4}} onClick={save}>Save</button>}>
    <div className="avedit">
      <button className="avpick" onClick={()=>fileIn.current.click()} aria-label="Change photo">
        <MeAvatar p={preview} size={108} vtn="me-av"/>
        <span className="avcam">{I.cameraSm}</span>
      </button>
      <div className="avbtns">
        <button className="chip out" onClick={()=>fileIn.current.click()}>{I.image} Choose photo</button>
        {photo && <button className="chip out" onClick={()=>setPhoto(null)}>{I.close} Remove</button>}
      </div>
      <input ref={fileIn} type="file" accept="image/*" hidden onChange={pick}/>
    </div>
    {!photo && <>
      <div className="sect">Avatar colour</div>
      <div className="hues">{HUES.map(h=><button key={h} className={"hue"+(hue===h?" on":"")} style={{background:avBg(h)}} onClick={()=>{ setHue(h); vibe(4); }} aria-label={`Colour ${h}`}>{hue===h && I.check2}</button>)}</div>
    </>}
    <div className="sect">Name</div>
    <input id="pname" className="field" value={name} onChange={e=>setName(e.target.value)} maxLength={30} placeholder="Your name"/>
    <p className="sheetnote" style={{marginTop:6}}>This is how you appear to people on Helloo.</p>
    <div className="sect">About</div>
    <input id="pabout" className="field" value={about} onChange={e=>setAbout(e.target.value)} maxLength={60} placeholder="What are you up to?"/>
    <div className="chips" style={{paddingTop:10,flexWrap:"wrap"}}>{STATUSES.map(([s,ic])=><button key={s} className={"chip out"+(about===s?" on":"")} onClick={()=>{ setAbout(s); vibe(4); }}>{ic}{s}</button>)}</div>
    <div className="sect">Gloobal</div>
    <div className="acts"><div className="memrow"><span style={{color:"var(--purple)"}}>{I.globe}</span><span style={{flex:1}}>{ME.flag} {ME.country}<small style={{display:"block",color:"var(--muted)"}}>Country comes from your Gloobal ID and can't be edited here.</small></span></div></div>
    <button className="primary" style={{marginTop:18}} disabled={!dirty} onClick={save}>Save changes</button>
  </SubPage>;
}

  return <SubPage title="Chats" onBack={onBack}>
    <div className="preview" style={{background:wallCss(p.wall)}}>
      <div className="feed" style={{paddingBlock:10}}>
        <div className="evrow them"><div className="bwrap them"><div className="b them"><Rich text={sample.text}/><span className="meta">{fmtTime(sample.t)}</span></div></div></div>
        <div className="evrow me"><div className="bwrap me"><div className="b me"><Rich text={sample2.text}/><span className="meta">{fmtTime(sample2.t)}<Tick st="read"/></span></div></div></div>
      </div>
    </div>
    <div className="sect">Bubble shape</div>
    <div className="seg">{[["round","Round"],["soft","Soft"],["sharp","Sharp"]].map(([k,l])=><button key={k} className={p.bubble===k?"on":""} onClick={()=>{ set({bubble:k}); vibe(4); }}>{l}</button>)}</div>
    <div className="sect">Text size</div>
    <div className="seg">{[["sm","Small"],["md","Medium"],["lg","Large"]].map(([k,l])=><button key={k} className={p.textSize===k?"on":""} onClick={()=>{ set({textSize:k}); vibe(4); }}>{l}</button>)}</div>
    <div className="sect">Wallpaper for all chats</div>
    <div className="walls">{WALLS.map(w=><button key={w.id} className={p.wall===w.id?"on":""} onClick={()=>{ set({wall:w.id}); vibe(6); }}>
      <span className="wsw" style={{background:w.css}}><i className="wb1"/><i className="wb2"/></span>{w.name}</button>)}</div>

function StoragePage({threads, onBack, onReset}) {
  let bytes = 0; try { bytes = (localStorage.getItem(STORE)||"").length; } catch(e) {}
  const evs = Object.values(threads).flat();
  const photos = evs.filter(e=>e.k==="img"), docs = evs.filter(e=>e.k==="doc"), voice = evs.filter(e=>e.k==="voice");

  return <SubPage title="Storage and data" onBack={onBack}>

      <div className="memrow"><span style={{color:"var(--ok)"}}>{I.lock}</span><span style={{flex:1}}>Calls and messages<small style={{display:"block",color:"var(--muted)"}}>Free over Wi-Fi and mobile data in every country. ₹0.00 spent.</small></span></div>

      <div className="dlgbtns"><button onClick={()=>setConfirm(false)}>Cancel</button><button className="danger" onClick={onReset}>Reset</button></div>

/* ---------- Incoming ---------- */
function Incoming({c, kind, sched, onAccept, onDecline}){
  return <div className="banner" role="alertdialog" aria-label={`Incoming ${kind} call from ${c.name}`}>
    <div className="ring"><Avatar c={c}/></div>
    <div className="rmain"><b>{sched || c.name}</b><br/><small>{sched ? `Scheduled ${kind} call · ${c.name} · starting now` : `Helloo ${kind} call · ${c.flag} ${c.country}`}</small></div>
    <button className="mini" style={{background:"var(--red)"}} onClick={onDecline} aria-label="Decline">{I.endSm}</button>
    <button className="mini" style={{background:"var(--ok)"}} onClick={onAccept} aria-label="Accept">{kind==="video"?I.video:I.phone}</button>
  </div>;
}

/* ---------- Call ---------- */
function CallClock({start}){
  const [, t] = useState(0);
  useEffect(()=>{ const i=setInterval(()=>t(x=>x+1),1000); return ()=>clearInterval(i); },[]);
  return <span style={{fontFamily:"var(--f-mono)"}}>{start ? fmtDur(Math.floor((Date.now()-start)/1000)) : "Ringing…"}</span>;
}
function CallScreen({call, c, onEnd, onChat, onMin}){
  const [, tick] = useState(0);
  const [mute, setMute] = useState(false);
  const [spk, setSpk] = useState(false);
  const [cam, setCam] = useState(call.kind==="video");
  const [keys, setKeys] = useState(false);
  const [tones, setTones] = useState([]);
  useEffect(()=>{ const t=setInterval(()=>tick(x=>x+1),1000); return ()=>clearInterval(t); },[]);
  const secs = call.start ? Math.floor((Date.now()-call.start)/1000) : 0;
  const live = call.state==="live";
  const kbps = live ? (cam ? 900 + (secs*37)%300 : 32 + (secs*7)%16) : 0;
  const mb = live ? ((kbps/8)*secs/1024).toFixed(1) : "0.0";
  const q = live ? (secs%23<20 ? "Excellent" : "Good") : "—";
  return <div className="call" role="dialog" aria-label={`Call with ${c.name}`}>
    {cam && live ? <div className="vidbg"/> : <div className="glow" style={{background:`radial-gradient(90% 60% at 50% 35%, hsl(${c.hue} 70% 50% / .5), transparent 70%)`}}/>}
    <div className="ctop pad">
      <button onClick={onMin} style={{display:"flex",alignItems:"center",gap:4,fontWeight:700}} aria-label="Minimise call">{I.back}Back</button>
      <span className="secure">{I.lock} E2E · {cam?"HD video":"HD voice"}</span>
    </div>
    {cam && live && <div className="selfview">You{mute?" · muted":""}</div>}
    <div className="cmid pad">
      {keys
        ? <>
            <div className="cstate" style={{minHeight:24,fontSize:22,letterSpacing:".1em"}}>{tones.join("")||" "}</div>
            <div className="keypadsm">{SYMS.map((s,i)=><button key={i} style={{color:i===2?"#FF9B5E":i===4?"#FF7DB5":i===5?"#BFA6FF":"inherit"}} onClick={()=>{ vibe(6); setTones(t=>[...t,s].slice(-12)); }}>{s}</button>)}</div>
          </>
        : <>
            <div className={live?"":"ring"}><Avatar c={c} size="lg"/></div>
            <h2>{c.name}</h2>
            <div className="cstate">{live ? fmtDur(secs) : (call.dir==="out" ? "Ringing…" : "Connecting…")}</div>
          </>}
      <div className="meter">
        <span>{c.flag} {c.country}</span>
        <span>Signal <b>{q}</b></span>
        <span>Data <b>{mb} MB</b></span>
        <span>Cost <b>₹0.00</b></span>
      </div>
    </div>
    <div className="ccontrols pad">
      <button className={"cbtn"+(mute?" on":"")} onClick={()=>setMute(x=>!x)} aria-pressed={mute}><span>{mute?I.micOff:I.mic}</span>{mute?"Muted":"Mute"}</button>
      <button className={"cbtn"+(cam?" on":"")} onClick={()=>setCam(x=>!x)} aria-pressed={cam}><span>{I.video}</span>{cam?"Camera":"Video"}</button>
      <button className={"cbtn"+(spk?" on":"")} onClick={()=>setSpk(x=>!x)} aria-pressed={spk}><span>{I.spk}</span>Speaker</button>
      <button className={"cbtn"+(keys?" on":"")} onClick={()=>setKeys(x=>!x)} aria-pressed={keys}><span>{I.padIcon}</span>Pad</button>
    </div>
    <div className="endrow" style={{gap:40,alignItems:"center"}}>
      <button className="cbtn" onClick={onChat}><span>{I.chatSm}</span>Chat</button>
      <button className="endbtn" onClick={onEnd} aria-label="End call">{I.end}</button>
      <span style={{width:58}}/>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
