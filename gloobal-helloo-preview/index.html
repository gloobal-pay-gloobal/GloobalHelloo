<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Helloo by GLOOBAL</title>
    <meta name="description" content="Free calls and messages with your GLOOBAL ID. Strangers pay your price, or ask." />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="theme-color" content="#1B1838" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Helloo" />
    <link rel="icon" type="image/svg+xml" href="/icons/helloo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/helloo-32.png" />
    <link rel="apple-touch-icon" href="/icons/helloo-180.png" />
    <!-- The six themes use these faces: Space Grotesk + Inter (GLOOBAL,
         Graphite), Fraunces (Paper), Baloo 2 (Bazaar), Poppins (Sky),
         DM Mono (figures). Only the weights the themes ask for. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #F6F5FC; overscroll-behavior: none; touch-action: pan-x pan-y; }
      @media (prefers-color-scheme: dark) { html, body { background: #0E0B1F; } }
      #root { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });
      window.addEventListener('wheel', function (e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
